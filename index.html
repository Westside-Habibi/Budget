<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="God's Plan"/>
<meta name="theme-color" content="#000000"/>
<title>God's Plan</title>
<style>
:root{
  --bg:#000000;
  --bg-elevated:#1c1c1e;
  --separator:rgba(84,84,88,0.36);
  --label:#ffffff;
  --label-secondary:rgba(235,235,245,0.6);
  --label-tertiary:rgba(235,235,245,0.3);
  --green:#30d158;
  --blue:#0a84ff;
  --red:#ff453a;
  --orange:#ff9f0a;
  --purple:#bf5af2;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);overscroll-behavior:none;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;color:var(--label);-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.3;}
.mono{font-family:"SF Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-variant-numeric:tabular-nums;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
input,button,textarea{font-family:inherit;}
button{cursor:pointer;background:none;border:none;color:inherit;}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}
.nav-bar{position:sticky;top:0;z-index:100;background:rgba(0,0,0,0.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding-top:max(env(safe-area-inset-top),20px);border-bottom:0.5px solid var(--separator);}
.nav-title-row{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 8px;}
.nav-large-title{font-size:34px;font-weight:700;letter-spacing:0.36px;color:var(--label);}
.nav-subtitle{font-size:13px;color:var(--label-secondary);font-weight:500;margin-top:1px;}
.month-picker-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;}
.month-chip{flex-shrink:0;padding:8px 16px;border-radius:99px;font-size:14px;font-weight:600;background:rgba(118,118,128,0.24);color:var(--label-secondary);white-space:nowrap;border:1px solid transparent;}
.month-chip.active{background:var(--blue);color:#fff;}
.section{margin:0 16px 32px;}
.section-header{font-size:13px;font-weight:590;color:var(--label-secondary);text-transform:uppercase;letter-spacing:0.4px;padding:0 4px 6px;margin-top:24px;}
.section-header:first-child{margin-top:0;}
.section-footer{font-size:13px;color:var(--label-tertiary);padding:6px 4px 0;line-height:1.4;}
.grouped-list{background:var(--bg-elevated);border-radius:var(--radius-md);overflow:hidden;}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;min-height:44px;gap:12px;border-bottom:0.5px solid var(--separator);}
.list-row:last-child{border-bottom:none;}
.list-row-label{font-size:16px;color:var(--label);flex:1;min-width:0;}
.list-row-sub{font-size:12px;color:var(--label-tertiary);margin-top:1px;}
.list-row-value{font-size:16px;color:var(--label-secondary);flex-shrink:0;}
.chevron{color:var(--label-tertiary);font-size:14px;margin-left:2px;}
.ios-num{background:transparent;border:none;color:var(--label);font-size:16px;text-align:right;width:90px;padding:2px 0;font-family:"SF Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.ios-num:focus{outline:none;}
.ios-text{background:transparent;border:none;color:var(--label);font-size:16px;padding:2px 0;width:100%;}
.ios-text:focus{outline:none;}
.ios-text::placeholder,.ios-num::placeholder{color:var(--label-tertiary);}
.hero-card{margin:0 16px 20px;padding:20px;border-radius:var(--radius-lg);background:linear-gradient(145deg,#1c1c1e,#0d0d0f);border:0.5px solid var(--separator);position:relative;overflow:hidden;}
.hero-glow{position:absolute;top:-60px;right:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(48,209,88,0.15),transparent 70%);pointer-events:none;}
.hero-eyebrow{font-size:12px;font-weight:600;color:var(--label-tertiary);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;}
.hero-amount{font-size:40px;font-weight:700;letter-spacing:-0.5px;color:var(--label);font-family:"SF Mono",ui-monospace,monospace;}
.hero-amount-unit{font-size:16px;color:var(--label-tertiary);font-weight:500;font-family:-apple-system,sans-serif;}
.hero-caption{font-size:14px;color:var(--label-secondary);margin-top:4px;}
.stat-grid{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;}
.stat-item .k{font-size:11px;color:var(--label-tertiary);text-transform:uppercase;letter-spacing:0.4px;font-weight:600;margin-bottom:3px;}
.stat-item .v{font-size:18px;font-weight:700;font-family:"SF Mono",ui-monospace,monospace;}
.progress-track{height:6px;background:rgba(118,118,128,0.24);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;transition:width 0.5s cubic-bezier(0.25,1,0.5,1);}
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.ring-label{position:absolute;font-family:"SF Mono",ui-monospace,monospace;font-weight:700;}
.callout{border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start;}
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(28,28,30,0.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:0.5px solid var(--separator);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px 6px;color:var(--label-tertiary);transition:color 0.15s;}
.tab-item.active{color:var(--blue);}
.tab-icon{font-size:22px;line-height:1;}
.tab-label{font-size:10px;font-weight:590;letter-spacing:0.1px;}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:900;display:flex;align-items:flex-end;animation:fadeIn 0.2s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg-elevated);width:100%;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding-bottom:max(env(safe-area-inset-bottom),20px);animation:slideUp 0.28s cubic-bezier(0.32,0.72,0,1);}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:5px;background:rgba(120,120,128,0.36);border-radius:99px;margin:8px auto 4px;}
.sheet-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:0.5px solid var(--separator);}
.sheet-nav-btn{font-size:17px;color:var(--blue);font-weight:400;padding:4px;}
.sheet-nav-btn.bold{font-weight:600;}
.sheet-nav-title{font-size:17px;font-weight:600;}
.sheet-body{padding:20px 16px;}
.field-group{margin-bottom:20px;}
.field-label{font-size:13px;font-weight:590;color:var(--label-secondary);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px;}
.field-input-wrap{background:rgba(118,118,128,0.15);border-radius:var(--radius-sm);padding:12px 14px;}
.color-row{display:flex;gap:10px;flex-wrap:wrap;}
.color-dot{width:32px;height:32px;border-radius:50%;position:relative;transition:transform 0.15s;}
.color-dot.selected::after{content:"";position:absolute;inset:-4px;border:2px solid #fff;border-radius:50%;}
.color-dot:active{transform:scale(0.88);}
.btn-text-destructive{color:var(--red);font-size:17px;font-weight:400;text-align:center;width:100%;padding:14px;}
.add-list-row{display:flex;align-items:center;gap:8px;padding:11px 16px;color:var(--blue);font-size:16px;font-weight:400;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toastHost"></div>
<script>
const SAVE_KEY = "godsplan_v2";
const DEFAULT_INCOME = 5390.00;
const APP_START_MONTH = "2026-09";
const PALETTE = ["#0a84ff","#30d158","#ff9f0a","#ff453a","#bf5af2","#64d2ff","#5e5ce6","#ff375f","#ffd60a"];

const DEFAULT_STATE = {
  tab: "overview", activeMonth: "2026-09", goalMonth: "2026-11", goalLabel: "Move Day",
  income: DEFAULT_INCOME, miscBudget: 1000, furnitureGoal: 5000,
  categories: {
    tesla: { label:"Tesla", color:"#ff453a", icon:"⚡", items:[
      {id:"tesla_ins",label:"Tesla Insurance",amount:198.78},
      {id:"tesla_fsd",label:"Tesla FSD",amount:106.67},
      {id:"tesla_rim",label:"Rim & Tire Protection",amount:16.00},
      {id:"tesla_wind",label:"Windshield Protection",amount:16.00},
    ]},
    housing: { label:"Housing", color:"#30d158", icon:"🏠", items:[{id:"rent",label:"Rent",amount:525.00}]},
    phone: { label:"Phone & Tech", color:"#0a84ff", icon:"📱", items:[
      {id:"tmobile",label:"T-Mobile",amount:250.00},
      {id:"apple_one",label:"Apple One",amount:37.95},
      {id:"amazon",label:"Amazon Prime",amount:7.53},
    ]},
    streaming: { label:"Streaming", color:"#bf5af2", icon:"🎬", items:[
      {id:"starz",label:"Starz",amount:11.99},
      {id:"paramount",label:"Paramount+",amount:8.00},
      {id:"disney",label:"Disney+",amount:10.00},
    ]},
    transport: { label:"Transportation", color:"#ff9f0a", icon:"🚗", items:[{id:"supercharge",label:"Tesla Supercharging",amount:60.00}]},
    misc: { label:"Misc / Personal", color:"#64d2ff", icon:"🔧", items:[] },
    investing: { label:"Investing", color:"#30d158", icon:"📊", items:[
      {id:"stocks",label:"Stocks / ETFs",amount:0},
      {id:"crypto",label:"Crypto",amount:0},
      {id:"retirement",label:"401k / IRA",amount:0},
      {id:"options",label:"Options / Trading",amount:0},
    ]},
  },
  goalExpenses: [
    {id:"mv1",label:"Bedroom Furniture (Master)",amount:800,estimate:"$800–$2,000"},
    {id:"mv2",label:"Kids Rooms (2–3 beds)",amount:1200,estimate:"$600–$2,400"},
    {id:"mv3",label:"Living Room",amount:1200,estimate:"$800–$2,500"},
    {id:"mv4",label:"Dining Table & Chairs",amount:500,estimate:"$400–$1,200"},
    {id:"mv5",label:"Moving Truck",amount:300,estimate:"$200–$400"},
    {id:"mv6",label:"Misc / Lamps / Rugs",amount:400,estimate:"$300–$800"},
  ],
  oneTimeExpenses: [{id:"ot1",label:"Car Repairs",amount:1780,month:"2026-09"}],
  monthOverrides: {},
  checklist: [
    {id:"cl1",label:"Open dedicated savings account",done:false},
    {id:"cl2",label:"Set up auto-transfer on the 1st",done:false},
    {id:"cl3",label:"Rotate streaming — pick one",done:false},
    {id:"cl4",label:"Get 3 moving truck quotes",done:false},
    {id:"cl5",label:"Find free supercharger spots",done:false},
    {id:"cl6",label:"Browse Wayfair / FB Marketplace",done:false},
    {id:"cl7",label:"Confirm townhouse lease signed",done:false},
  ],
};

function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      return { ...DEFAULT_STATE, ...p,
        categories: p.categories || DEFAULT_STATE.categories,
        goalExpenses: p.goalExpenses || DEFAULT_STATE.goalExpenses,
        oneTimeExpenses: p.oneTimeExpenses || DEFAULT_STATE.oneTimeExpenses,
        monthOverrides: p.monthOverrides || {},
        checklist: p.checklist || DEFAULT_STATE.checklist,
      };
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

let S = loadState();
let sheet = null;
let saveTimer = null;

function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); showToast(); }catch(e){} }, 400);
}
function showToast(){
  const host = document.getElementById("toastHost");
  host.innerHTML = `<div style="position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(44,44,46,0.92);backdrop-filter:blur(20px);color:#30d158;padding:8px 18px;border-radius:99px;font-size:13px;font-weight:600;letter-spacing:0.2px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.3);animation:toastIn 0.25s ease;">✓ Saved</div><style>@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}</style>`;
  setTimeout(()=>{ host.innerHTML=""; }, 1600);
}

const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sept","Oct","Nov","Dec"];
function monthLabel(ym){ const [y,m]=ym.split("-").map(Number); return `${MONTH_NAMES[m-1]} ${y}`; }
function monthShort(ym){ const [y,m]=ym.split("-").map(Number); return MONTH_NAMES[m-1]; }
function addMonths(ym,n){ let [y,m]=ym.split("-").map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return `${y}-${String(m).padStart(2,"0")}`; }
function monthDiff(a,b){ const [ay,am]=a.split("-").map(Number),[by,bm]=b.split("-").map(Number); return (by-ay)*12+(bm-am); }
function allTrackedMonths(){
  const set = new Set(); set.add(APP_START_MONTH); set.add(S.goalMonth);
  Object.keys(S.monthOverrides).forEach(m=>set.add(m));
  S.oneTimeExpenses.forEach(e=>set.add(e.month));
  const months = Array.from(set);
  const minM = months.reduce((a,b)=>monthDiff(a,b)>0?a:b);
  const maxM = months.reduce((a,b)=>monthDiff(a,b)<0?a:b);
  const out = []; let cur = minM;
  while(monthDiff(cur,maxM)>=0){ out.push(cur); cur = addMonths(cur,1); }
  return out;
}

const fmt = n => Number(n||0).toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const clamp = v => Math.max(0, Number(v)||0);
const uid = () => "x"+Math.random().toString(36).slice(2,9);

function catSum(key){ return (S.categories[key]?.items||[]).reduce((s,i)=>s+clamp(i.amount),0); }
function totalFixed(){ return Object.keys(S.categories).filter(k=>k!=="investing").reduce((s,k)=>s+catSum(k),0); }
function totalInvesting(){ return catSum("investing"); }
function goalTotal(){ return S.goalExpenses.reduce((s,e)=>s+clamp(e.amount),0); }
function oneTimeForMonth(ym){ return S.oneTimeExpenses.filter(e=>e.month===ym).reduce((s,e)=>s+clamp(e.amount),0); }
function incomeForMonth(ym){ return S.monthOverrides[ym]?.income ?? S.income; }
function miscForMonth(ym){ return S.monthOverrides[ym]?.miscBudget ?? S.miscBudget; }
function fixedForMonth(ym){ return S.monthOverrides[ym]?.fixedOverride ?? totalFixed(); }
function netSavingsForMonth(ym){ return incomeForMonth(ym) - fixedForMonth(ym) - miscForMonth(ym) - oneTimeForMonth(ym); }
function cumulativeThrough(ym){
  let cur = APP_START_MONTH, total = 0;
  while(monthDiff(cur,ym) >= 0){ total += netSavingsForMonth(cur); if(cur===ym) break; cur = addMonths(cur,1); }
  return total;
}

function ring(pct, r, stroke, color){
  const circ = 2*Math.PI*r; const filled = circ*Math.min(1,Math.max(0,pct/100)); const sz = (r+stroke)*2+4;
  return `<div class="ring-wrap"><svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="rgba(118,118,128,0.24)" stroke-width="${stroke}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${filled} ${circ}" stroke-linecap="round" style="transition:stroke-dasharray 0.6s cubic-bezier(0.25,1,0.5,1)"/></svg><div class="ring-label" style="color:${color};font-size:${r*0.34}px">${pct.toFixed(0)}%</div></div>`;
}
function statItem(k,v,color){ return `<div class="stat-item"><div class="k">${k}</div><div class="v" style="color:${color||"var(--label)"}">${v}</div></div>`; }
function listRow({label,sub,value,valueColor,onClickAttr,chevron}){
  return `<div class="list-row" ${onClickAttr||""}><div style="min-width:0"><div class="list-row-label">${label}</div>${sub?`<div class="list-row-sub">${sub}</div>`:""}</div><div style="display:flex;align-items:center;gap:4px;flex-shrink:0"><span class="list-row-value mono" style="color:${valueColor||"var(--label-secondary)"}">${value}</span>${chevron?'<span class="chevron">›</span>':""}</div></div>`;
}
function numInputRow(label,dataAttr,value){
  return `<div class="list-row"><div style="min-width:0;flex:1"><div class="list-row-label">${label}</div></div><div style="display:flex;align-items:center;gap:2px;flex-shrink:0"><span style="color:var(--label-tertiary);font-size:16px">$</span><input type="number" inputmode="decimal" ${dataAttr}="${value.id}" value="${clamp(value.amount)}" class="ios-num"/></div></div>`;
}

function buildOverview(){
  const ym = S.activeMonth;
  const income = incomeForMonth(ym), fixed = fixedForMonth(ym), misc = miscForMonth(ym), ot = oneTimeForMonth(ym);
  const ns = netSavingsForMonth(ym), rate = income>0 ? (ns/income*100) : 0;
  const gt = goalTotal(), cumAtGoal = cumulativeThrough(S.goalMonth);
  const ringPct = gt>0 ? Math.min(100,(cumAtGoal/gt)*100) : 100;
  const onTrack = cumAtGoal >= gt;
  const months = []; let cur = APP_START_MONTH;
  while(monthDiff(cur,S.goalMonth) >= 0){ months.push(cur); cur = addMonths(cur,1); }
  const maxCum = Math.max(cumAtGoal, gt, 1);
  const bars = months.map(m=>{
    const cum = cumulativeThrough(m); const pct = Math.min(100,(cum/maxCum)*100);
    const hit = cum >= gt && gt>0; const isGoalMonth = m===S.goalMonth;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:44px"><div class="mono" style="font-size:10px;font-weight:600;color:${hit?"var(--green)":"var(--label-secondary)"}">${fmt(cum)}</div><div style="width:100%;height:100px;background:rgba(118,118,128,0.12);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden"><div style="width:100%;height:${pct}%;background:${hit?"linear-gradient(0deg,#30d158,#28bd4d)":"linear-gradient(0deg,#0a84ff99,#0a84ff55)"};border-radius:6px;min-height:4px;transition:height 0.6s cubic-bezier(0.25,1,0.5,1)"></div></div><div style="font-size:11px;color:${isGoalMonth?"var(--label)":"var(--label-tertiary)"};font-weight:${isGoalMonth?700:500}">${monthShort(m)}</div>${isGoalMonth?`<div style="font-size:8px;color:var(--purple);letter-spacing:0.5px;font-weight:700">${S.goalLabel.toUpperCase()}</div>`:""}</div>`;
  }).join("");
  const tips = [];
  const streamTotal = catSum("streaming");
  if(streamTotal>25) tips.push({c:"var(--purple)",bg:"rgba(191,90,242,0.12)",icon:"🎬",msg:`Rotating streaming services could free up ~${fmt(streamTotal*0.5)}/mo.`});
  if(rate>=25) tips.push({c:"var(--green)",bg:"rgba(48,209,88,0.12)",icon:"💪",msg:`Excellent savings rate of ${rate.toFixed(0)}% this month.`});
  if(ot>0) tips.push({c:"var(--orange)",bg:"rgba(255,159,10,0.12)",icon:"⚠️",msg:`${fmt(ot)} in one-time expenses hits this month.`});
  return `
  <div class="hero-card"><div class="hero-glow"></div>
    <div class="hero-eyebrow">${monthLabel(ym)}</div>
    <div class="hero-amount">${fmt(ns)}<span class="hero-amount-unit"> saved</span></div>
    <div class="hero-caption">${income>0?rate.toFixed(1)+"% of "+fmt(income)+" income":""}</div>
    <div class="stat-grid">${statItem("Income",fmt(income),"var(--green)")}${statItem("Fixed",fmt(fixed),"var(--red)")}${statItem("Misc",fmt(misc),"var(--orange)")}${ot>0?statItem("One-Time",fmt(ot),"var(--red)"):""}</div>
  </div>
  <div class="section">
    <div class="section-header">${S.goalLabel} Goal</div>
    <div class="grouped-list" style="padding:18px 16px">
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        ${ring(ringPct,42,7,onTrack?"var(--green)":"var(--orange)")}
        <div style="flex:1;min-width:140px">
          <div class="mono" style="font-size:22px;font-weight:700;color:${onTrack?"var(--green)":"var(--orange)"}">${fmt(cumAtGoal)}</div>
          <div style="font-size:13px;color:var(--label-secondary);margin-top:2px">of ${fmt(gt)} goal · ${monthLabel(S.goalMonth)}</div>
          <div style="font-size:12px;color:${onTrack?"var(--green)":"var(--orange)"};margin-top:4px;font-weight:600">${onTrack?"✓ On track":"⚠ "+fmt(gt-cumAtGoal)+" short"}</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-top:20px;overflow-x:auto">${bars}</div>
    </div>
  </div>
  ${tips.length?`<div class="section"><div class="section-header">Insights</div><div style="display:flex;flex-direction:column;gap:8px">${tips.map(t=>`<div class="callout" style="background:${t.bg};color:${t.c}"><span style="font-size:16px">${t.icon}</span><span>${t.msg}</span></div>`).join("")}</div></div>`:""}
  <div class="section">
    <div class="section-header">This Month</div>
    <div class="grouped-list">
      ${listRow({label:"Income",value:fmt(income),valueColor:"var(--green)"})}
      ${listRow({label:"Fixed Expenses",value:fmt(fixed),valueColor:"var(--red)"})}
      ${listRow({label:"Misc Buffer",value:fmt(misc),valueColor:"var(--orange)"})}
      ${ot>0?listRow({label:"One-Time Expenses",value:fmt(ot),valueColor:"var(--red)"}):""}
      ${listRow({label:"Net Savings",value:fmt(ns),valueColor:"var(--blue)"})}
    </div>
  </div>`;
}

function categoryList(key){
  const cat = S.categories[key]; if(!cat) return "";
  const total = catSum(key);
  const rows = cat.items.map(i=>numInputRow(i.label,"data-item",i)).join("");
  return `<div class="section">
    <div class="section-header" style="display:flex;justify-content:space-between;align-items:center"><span>${cat.icon} ${cat.label}</span><button data-editcat="${key}" style="color:var(--blue);font-size:13px;font-weight:590;text-transform:none;letter-spacing:0">Edit</button></div>
    <div class="grouped-list">${rows || `<div style="padding:16px;text-align:center;color:var(--label-tertiary);font-size:14px">No items yet</div>`}</div>
    <div class="section-footer" style="text-align:right;font-weight:600;color:${cat.color}">${fmt(total)} total</div>
  </div>`;
}

function buildBudget(){
  const fixed = totalFixed(); const ym = S.activeMonth; const income = incomeForMonth(ym);
  const pct = income>0 ? (fixed/income*100) : 0;
  const catKeys = Object.keys(S.categories).filter(k=>k!=="investing");
  return `
  <div class="section">
    <div class="grouped-list" style="padding:16px">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px"><span style="font-size:13px;color:var(--label-secondary)">Fixed Expenses / Income</span><span class="mono" style="font-size:13px;font-weight:600">${pct.toFixed(0)}%</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,pct)}%;background:${pct>80?"var(--red)":"var(--blue)"}"></div></div>
      <div class="stat-grid" style="margin-top:16px">${statItem("Total Fixed",fmt(fixed),"var(--red)")}${statItem("Remaining",fmt(income-fixed),"var(--green)")}</div>
    </div>
  </div>
  ${catKeys.map(categoryList).join("")}
  <div class="section">
    <div class="section-header">Misc Buffer</div>
    <div class="grouped-list"><div class="list-row"><div><div class="list-row-label">Monthly Buffer</div><div class="list-row-sub">Dining · personal · unplanned</div></div><div style="display:flex;align-items:center;gap:2px"><span style="color:var(--label-tertiary)">$</span><input type="number" inputmode="decimal" id="miscBudgetInput" value="${clamp(S.miscBudget)}" class="ios-num"/></div></div></div>
  </div>
  <div class="section">
    <div class="section-header">One-Time Expenses</div>
    <div class="grouped-list">
      ${S.oneTimeExpenses.length ? S.oneTimeExpenses.map(e=>listRow({label:e.label,sub:monthLabel(e.month),value:fmt(e.amount),valueColor:"var(--red)",chevron:true,onClickAttr:`data-editone="${e.id}"`})).join("") : `<div style="padding:16px;text-align:center;color:var(--label-tertiary);font-size:14px">None yet</div>`}
      <div class="add-list-row" data-addone="1"><span style="font-size:18px;line-height:1">＋</span> Add One-Time Expense</div>
    </div>
  </div>
  <div class="section"><div class="add-list-row" style="background:var(--bg-elevated);border-radius:var(--radius-md)" data-addcat="1"><span style="font-size:18px;line-height:1">＋</span> Add Category</div></div>`;
}

function buildGoal(){
  const gt = goalTotal(); const cumAtGoal = cumulativeThrough(S.goalMonth); const onTrack = cumAtGoal >= gt;
  const monthsLeft = monthDiff(S.activeMonth, S.goalMonth);
  const rows = S.goalExpenses.map(e=>`<div class="list-row"><div style="min-width:0;flex:1"><div class="list-row-label">${e.label}</div>${e.estimate?`<div class="list-row-sub">Est. ${e.estimate}</div>`:""}</div><div style="display:flex;align-items:center;gap:6px;flex-shrink:0"><span style="color:var(--label-tertiary)">$</span><input type="number" inputmode="decimal" data-goalitem="${e.id}" value="${clamp(e.amount)}" class="ios-num"/><button data-editgoalitem="${e.id}" style="color:var(--label-tertiary);font-size:14px;padding:2px 4px">✏️</button></div></div>`).join("");
  return `
  <div class="hero-card"><div class="hero-glow"></div>
    <div class="hero-eyebrow">${S.goalLabel} · ${monthLabel(S.goalMonth)}</div>
    <div class="hero-amount">${fmt(gt)}</div>
    <div class="hero-caption">${monthsLeft>0?monthsLeft+" month"+(monthsLeft===1?"":"s")+" away":"This is goal month"}</div>
    <div class="stat-grid">${statItem("Projected",fmt(cumAtGoal),onTrack?"var(--green)":"var(--orange)")}${statItem("Status",onTrack?"On track":"Short "+fmt(gt-cumAtGoal),onTrack?"var(--green)":"var(--orange)")}</div>
  </div>
  <div class="section"><div class="section-header">Goal Settings</div><div class="grouped-list">
    ${listRow({label:"Goal Name",value:S.goalLabel,chevron:true,onClickAttr:'data-editgoal="name"'})}
    ${listRow({label:"Target Month",value:monthLabel(S.goalMonth),chevron:true,onClickAttr:'data-editgoal="month"'})}
    ${listRow({label:"Target Amount",value:fmt(S.furnitureGoal),chevron:true,onClickAttr:'data-editgoal="amount"'})}
  </div></div>
  <div class="section"><div class="section-header">Line Items</div><div class="grouped-list">${rows}<div class="add-list-row" data-addgoalitem="1"><span style="font-size:18px;line-height:1">＋</span> Add Line Item</div></div></div>
  <div class="section"><div class="section-header">Tips</div><div style="display:flex;flex-direction:column;gap:8px">
    ${[["🚚","Book movers or a truck 4–6 weeks out — rates rise closer to the date."],["🛋️","Facebook Marketplace covers dressers & dining sets for 50–70% less than new."],["📐","Budget 10% extra — unexpected costs are nearly guaranteed."]].map(([icon,msg])=>`<div class="callout" style="background:rgba(118,118,128,0.12);color:var(--label-secondary)"><span style="font-size:16px">${icon}</span><span>${msg}</span></div>`).join("")}
  </div></div>`;
}

function buildInvesting(){
  const mi = totalInvesting();
  return `
  <div class="hero-card"><div class="hero-glow"></div>
    <div class="hero-eyebrow">Monthly Investing</div>
    <div class="hero-amount">${fmt(mi)}</div>
    <div class="hero-caption">${mi>0?"Building wealth alongside your savings goal":"Set an amount below to start tracking"}</div>
  </div>
  ${categoryList("investing")}
  <div class="section"><div class="section-header">Priority Order</div><div class="grouped-list">
    ${[["1","Emergency fund (3 months expenses)","var(--orange)"],["2","High-interest debt payoff","var(--red)"],["3","401k up to employer match","var(--green)"],["4","Current savings goal","var(--blue)"],["5","Stocks / crypto / active trading","var(--green)"]].map(([n,l,c])=>`<div class="list-row"><div style="width:22px;height:22px;border-radius:50%;background:${c}22;border:1px solid ${c};display:flex;align-items:center;justify-content:center;font-size:11px;color:${c};font-weight:700;flex-shrink:0">${n}</div><span style="font-size:15px;color:var(--label-secondary);flex:1;margin-left:10px">${l}</span></div>`).join("")}
  </div></div>`;
}

function buildMonths(){
  const months = allTrackedMonths();
  const rows = months.map(m=>{
    const ns = netSavingsForMonth(m); const isCurrent = m===S.activeMonth; const isGoal = m===S.goalMonth;
    return `<div class="list-row" data-gotomonth="${m}"><div style="display:flex;align-items:center;gap:10px;min-width:0"><div style="width:8px;height:8px;border-radius:50%;background:${isCurrent?"var(--blue)":isGoal?"var(--purple)":"var(--label-tertiary)"};flex-shrink:0"></div><div><div class="list-row-label">${monthLabel(m)}${isGoal?" · "+S.goalLabel:""}</div><div class="list-row-sub">${ns>=0?fmt(ns)+" saved":fmt(Math.abs(ns))+" over budget"}</div></div></div><span class="chevron">›</span></div>`;
  }).join("");
  return `
  <div class="section"><div class="section-header">All Months</div><div class="grouped-list">${rows}</div><div class="section-footer">Tap a month to view it. Add future months to keep budgeting past your goal date.</div></div>
  <div class="section"><div class="add-list-row" style="background:var(--bg-elevated);border-radius:var(--radius-md)" data-addmonth="1"><span style="font-size:18px;line-height:1">＋</span> Add Next Month</div></div>
  <div class="section"><div class="section-header">Base Monthly Income</div><div class="grouped-list"><div class="list-row"><div class="list-row-label">Default Income</div><div style="display:flex;align-items:center;gap:2px"><span style="color:var(--label-tertiary)">$</span><input type="number" inputmode="decimal" id="baseIncomeInput" value="${clamp(S.income)}" class="ios-num" style="width:100px"/></div></div></div><div class="section-footer">Applies to every month unless overridden individually.</div></div>`;
}

function buildChecklist(){
  const done = S.checklist.filter(c=>c.done).length; const total = S.checklist.length; const pct = total>0?(done/total*100):0;
  const items = S.checklist.map(c=>`<div class="list-row" data-toggle="${c.id}"><div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0"><div style="width:24px;height:24px;border-radius:50%;flex-shrink:0;background:${c.done?"var(--green)":"transparent"};border:2px solid ${c.done?"var(--green)":"rgba(118,118,128,0.4)"};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#000;transition:all 0.2s">${c.done?"✓":""}</div><span style="font-size:16px;color:${c.done?"var(--label-tertiary)":"var(--label)"};text-decoration:${c.done?"line-through":"none"}">${c.label}</span></div><button data-delcl="${c.id}" style="color:var(--label-tertiary);font-size:13px;padding:4px 6px;flex-shrink:0">✕</button></div>`).join("");
  return `
  <div class="section"><div class="grouped-list" style="padding:18px 16px"><div style="display:flex;align-items:center;gap:14px">${ring(pct,32,5,"var(--green)")}<div><div style="font-size:17px;font-weight:700">Move Checklist</div><div style="font-size:13px;color:var(--label-secondary);margin-top:2px">${done} of ${total} complete</div></div></div></div></div>
  <div class="section"><div class="grouped-list">${items}</div></div>
  <div class="section"><div class="grouped-list" style="padding:10px 12px"><div style="display:flex;gap:8px"><input type="text" id="newCheckItem" placeholder="Add item..." class="ios-text" style="background:rgba(118,118,128,0.15);border-radius:8px;padding:10px 12px"/><button id="addCheckItem" style="background:var(--blue);color:#fff;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:600;flex-shrink:0">Add</button></div></div></div>`;
}

function colorPicker(selected){ return `<div class="color-row">${PALETTE.map(c=>`<div class="color-dot ${c===selected?"selected":""}" style="background:${c}" data-pickcolor="${c}"></div>`).join("")}</div>`; }

function buildSheet(){
  if(!sheet) return "";
  let title="", body="";
  if(sheet.type==="editCat"){
    const cat = S.categories[sheet.key]; title = "Edit Category";
    const items = cat.items.map(i=>`<div class="list-row" style="gap:8px"><input type="text" data-editlbl="${i.id}" value="${i.label}" class="ios-text"/><button data-delitem="${i.id}" style="color:var(--red);font-size:14px;flex-shrink:0">Remove</button></div>`).join("");
    body = `<div class="field-group"><div class="field-label">Name</div><div class="field-input-wrap"><input type="text" id="catName" value="${cat.label}" class="ios-text"/></div></div><div class="field-group"><div class="field-label">Icon</div><div class="field-input-wrap"><input type="text" id="catIcon" value="${cat.icon}" class="ios-text" style="width:60px"/></div></div><div class="field-group"><div class="field-label">Color</div>${colorPicker(cat.color)}</div><div class="field-group"><div class="field-label">Items</div><div class="grouped-list">${items||'<div style="padding:14px;color:var(--label-tertiary);font-size:14px">No items</div>'}</div><div style="display:flex;gap:8px;margin-top:10px"><div class="field-input-wrap" style="flex:1"><input type="text" id="newItemName" placeholder="New item name" class="ios-text"/></div><button id="addItemBtn" style="background:var(--blue);color:#fff;border-radius:10px;padding:0 16px;font-size:15px;font-weight:600">Add</button></div></div>${!["tesla","housing","phone","streaming","transport","misc","investing"].includes(sheet.key)?`<button class="btn-text-destructive" id="deleteCatBtn">Delete Category</button>`:""}`;
  }
  if(sheet.type==="addCat"){
    sheet.color = sheet.color || "#0a84ff"; title = "New Category";
    body = `<div class="field-group"><div class="field-label">Name</div><div class="field-input-wrap"><input type="text" id="catName" placeholder="e.g. Pet Care" class="ios-text"/></div></div><div class="field-group"><div class="field-label">Icon</div><div class="field-input-wrap"><input type="text" id="catIcon" placeholder="🐾" class="ios-text" style="width:60px"/></div></div><div class="field-group"><div class="field-label">Color</div>${colorPicker(sheet.color)}</div>`;
  }
  if(sheet.type==="editOne" || sheet.type==="addOne"){
    const e = sheet.type==="editOne" ? S.oneTimeExpenses.find(x=>x.id===sheet.id) : {label:"",amount:0,month:S.activeMonth};
    title = sheet.type==="editOne" ? "Edit Expense" : "New One-Time Expense";
    const months = allTrackedMonths();
    body = `<div class="field-group"><div class="field-label">Label</div><div class="field-input-wrap"><input type="text" id="oneLabel" value="${e.label}" placeholder="e.g. Car Repair" class="ios-text"/></div></div><div class="field-group"><div class="field-label">Amount</div><div class="field-input-wrap" style="display:flex;align-items:center;gap:4px"><span style="color:var(--label-tertiary)">$</span><input type="number" inputmode="decimal" id="oneAmount" value="${clamp(e.amount)}" class="ios-text"/></div></div><div class="field-group"><div class="field-label">Month</div><div style="display:flex;gap:8px;flex-wrap:wrap">${months.map(m=>`<div class="month-chip ${m===e.month?"active":""}" data-pickmonth="${m}">${monthLabel(m)}</div>`).join("")}</div></div>${sheet.type==="editOne"?`<button class="btn-text-destructive" id="deleteOneBtn">Delete Expense</button>`:""}`;
  }
  if(sheet.type==="addGoalItem" || sheet.type==="editGoalItem"){
    const e = sheet.type==="editGoalItem" ? S.goalExpenses.find(x=>x.id===sheet.id) : {label:"",amount:0,estimate:""};
    title = sheet.type==="editGoalItem" ? "Edit Line Item" : "New Line Item";
    body = `<div class="field-group"><div class="field-label">Label</div><div class="field-input-wrap"><input type="text" id="giLabel" value="${e.label}" placeholder="e.g. Storage Unit" class="ios-text"/></div></div><div class="field-group"><div class="field-label">Amount</div><div class="field-input-wrap" style="display:flex;align-items:center;gap:4px"><span style="color:var(--label-tertiary)">$</span><input type="number" inputmode="decimal" id="giAmount" value="${clamp(e.amount)}" class="ios-text"/></div></div><div class="field-group"><div class="field-label">Estimate Range (optional)</div><div class="field-input-wrap"><input type="text" id="giEstimate" value="${e.estimate||""}" placeholder="e.g. $200–$500" class="ios-text"/></div></div>${sheet.type==="editGoalItem"?`<button class="btn-text-destructive" id="deleteGoalItemBtn">Delete Item</button>`:""}`;
  }
  if(sheet.type==="addMonth"){
    const last = allTrackedMonths().slice(-1)[0]; const next = addMonths(last,1); title = "Add Month";
    body = `<div style="text-align:center;padding:12px 0 20px"><div style="font-size:15px;color:var(--label-secondary);margin-bottom:6px">Next month to add:</div><div style="font-size:24px;font-weight:700">${monthLabel(next)}</div></div><div class="field-group"><div class="field-label">Income Override (optional)</div><div class="field-input-wrap" style="display:flex;align-items:center;gap:4px"><span style="color:var(--label-tertiary)">$</span><input type="number" inputmode="decimal" id="newMonthIncome" value="${clamp(S.income)}" class="ios-text"/></div></div>`;
    sheet._nextMonth = next;
  }
  if(sheet.type==="editGoalName"){ title = "Goal Name"; body = `<div class="field-group"><div class="field-input-wrap"><input type="text" id="goalNameInput" value="${S.goalLabel}" class="ios-text"/></div></div>`; }
  if(sheet.type==="editGoalMonth"){ title = "Target Month"; const months = allTrackedMonths(); body = `<div style="display:flex;gap:8px;flex-wrap:wrap;padding:4px 0">${months.map(m=>`<div class="month-chip ${m===S.goalMonth?"active":""}" data-pickgoalmonth="${m}">${monthLabel(m)}</div>`).join("")}</div>`; }
  if(sheet.type==="editGoalAmount"){ title = "Target Amount"; body = `<div class="field-group"><div class="field-input-wrap" style="display:flex;align-items:center;gap:4px"><span style="color:var(--label-tertiary)">$</span><input type="number" inputmode="decimal" id="goalAmountInput" value="${clamp(S.furnitureGoal)}" class="ios-text"/></div></div>`; }

  return `<div class="sheet-bg" id="sheetBg"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-nav"><button class="sheet-nav-btn" id="sheetCancel">Cancel</button><div class="sheet-nav-title">${title}</div><button class="sheet-nav-btn bold" id="sheetSave">Done</button></div><div class="sheet-body">${body}</div></div></div>`;
}

function buildNav(){
  const ym = S.activeMonth; const months = allTrackedMonths();
  const chips = months.map(m=>`<div class="month-chip ${m===ym?"active":""}" data-setmonth="${m}">${monthShort(m)}${m===S.goalMonth?" 🎯":""}</div>`).join("");
  return `<div class="nav-bar"><div class="nav-title-row"><div><div class="nav-large-title">God's Plan</div><div class="nav-subtitle">${monthLabel(ym)}</div></div></div><div class="month-picker-scroll">${chips}</div></div>`;
}

function buildTabBar(){
  const TABS = [{id:"overview",icon:"🏁",label:"Overview"},{id:"budget",icon:"💰",label:"Budget"},{id:"goal",icon:"🎯",label:S.goalLabel.split(" ")[0]},{id:"investing",icon:"📊",label:"Invest"},{id:"months",icon:"🗓️",label:"Months"},{id:"checklist",icon:"✅",label:"Plan"}];
  return `<div class="tab-bar">${TABS.map(t=>`<button class="tab-item ${S.tab===t.id?"active":""}" data-tab="${t.id}"><span class="tab-icon">${t.icon}</span><span class="tab-label">${t.label}</span></button>`).join("")}</div>`;
}

function render(){
  let content = "";
  if(S.tab==="overview") content = buildOverview();
  if(S.tab==="budget") content = buildBudget();
  if(S.tab==="goal") content = buildGoal();
  if(S.tab==="investing") content = buildInvesting();
  if(S.tab==="months") content = buildMonths();
  if(S.tab==="checklist") content = buildChecklist();
  document.getElementById("app").innerHTML = `${buildNav()}<div style="padding:16px 0 100px;max-width:600px;margin:0 auto">${content}</div>${buildTabBar()}${buildSheet()}`;
  attachEvents();
}

function attachEvents(){
  const app = document.getElementById("app");
  app.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.tab;render();}));
  app.querySelectorAll("[data-setmonth]").forEach(b=>b.addEventListener("click",()=>{S.activeMonth=b.dataset.setmonth;render();}));
  app.querySelectorAll("[data-gotomonth]").forEach(b=>b.addEventListener("click",()=>{S.activeMonth=b.dataset.gotomonth;S.tab="overview";render();}));
  app.querySelectorAll("input[data-item]").forEach(inp=>inp.addEventListener("input",()=>{
    const id = inp.dataset.item;
    Object.values(S.categories).forEach(cat=>{ const item=cat.items.find(i=>i.id===id); if(item) item.amount=clamp(inp.value); });
    save(); render();
  }));
  const miscInp = document.getElementById("miscBudgetInput");
  if(miscInp) miscInp.addEventListener("input",()=>{ S.miscBudget=clamp(miscInp.value); save(); render(); });
  const baseInc = document.getElementById("baseIncomeInput");
  if(baseInc) baseInc.addEventListener("input",()=>{ S.income=clamp(baseInc.value); save(); render(); });
  app.querySelectorAll("input[data-goalitem]").forEach(inp=>inp.addEventListener("input",()=>{
    const e = S.goalExpenses.find(x=>x.id===inp.dataset.goalitem); if(e){ e.amount = clamp(inp.value); save(); render(); }
  }));
  app.querySelectorAll("[data-editcat]").forEach(b=>b.addEventListener("click",()=>{sheet={type:"editCat",key:b.dataset.editcat,color:S.categories[b.dataset.editcat].color};render();}));
  const addCatBtn = app.querySelector("[data-addcat]"); if(addCatBtn) addCatBtn.addEventListener("click",()=>{sheet={type:"addCat"};render();});
  app.querySelectorAll("[data-editone]").forEach(b=>b.addEventListener("click",()=>{sheet={type:"editOne",id:b.dataset.editone,month:S.oneTimeExpenses.find(x=>x.id===b.dataset.editone).month};render();}));
  const addOneBtn = app.querySelector("[data-addone]"); if(addOneBtn) addOneBtn.addEventListener("click",()=>{sheet={type:"addOne",month:S.activeMonth};render();});
  app.querySelectorAll("[data-editgoalitem]").forEach(b=>b.addEventListener("click",()=>{sheet={type:"editGoalItem",id:b.dataset.editgoalitem};render();}));
  const addGoalItemBtn = app.querySelector("[data-addgoalitem]"); if(addGoalItemBtn) addGoalItemBtn.addEventListener("click",()=>{sheet={type:"addGoalItem"};render();});
  app.querySelectorAll("[data-editgoal]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.editgoal;
    if(k==="name") sheet={type:"editGoalName"}; if(k==="month") sheet={type:"editGoalMonth"}; if(k==="amount") sheet={type:"editGoalAmount"};
    render();
  }));
  const addMonthBtn = app.querySelector("[data-addmonth]"); if(addMonthBtn) addMonthBtn.addEventListener("click",()=>{sheet={type:"addMonth"};render();});
  app.querySelectorAll("[data-toggle]").forEach(row=>row.addEventListener("click",e=>{
    if(e.target.closest("[data-delcl]")) return;
    const item=S.checklist.find(c=>c.id===row.dataset.toggle); if(item){item.done=!item.done;save();render();}
  }));
  app.querySelectorAll("[data-delcl]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); S.checklist=S.checklist.filter(c=>c.id!==b.dataset.delcl); save();render(); }));
  const addCI = document.getElementById("addCheckItem");
  if(addCI) addCI.addEventListener("click",()=>{ const inp=document.getElementById("newCheckItem"); const v=inp?.value?.trim(); if(!v) return; S.checklist.push({id:uid(),label:v,done:false}); save(); render(); });
  const sheetCancel = document.getElementById("sheetCancel"); if(sheetCancel) sheetCancel.addEventListener("click",()=>{sheet=null;render();});
  const sheetBg = document.getElementById("sheetBg"); if(sheetBg) sheetBg.addEventListener("click",e=>{if(e.target===sheetBg){sheet=null;render();}});

  if(sheet?.type==="editCat" || sheet?.type==="addCat"){
    app.querySelectorAll("[data-pickcolor]").forEach(d=>d.addEventListener("click",()=>{
      sheet.color = d.dataset.pickcolor;
      app.querySelectorAll("[data-pickcolor]").forEach(x=>x.classList.toggle("selected", x.dataset.pickcolor===sheet.color));
    }));
  }
  if(sheet?.type==="editCat"){
    const key = sheet.key;
    app.querySelectorAll("[data-delitem]").forEach(b=>b.addEventListener("click",()=>{ S.categories[key].items = S.categories[key].items.filter(i=>i.id!==b.dataset.delitem); render(); }));
    const addItemBtn = document.getElementById("addItemBtn");
    if(addItemBtn) addItemBtn.addEventListener("click",()=>{ const v = document.getElementById("newItemName")?.value?.trim(); if(!v) return; S.categories[key].items.push({id:uid(),label:v,amount:0}); render(); });
    const doneBtn = document.getElementById("sheetSave");
    if(doneBtn) doneBtn.addEventListener("click",()=>{
      app.querySelectorAll("[data-editlbl]").forEach(inp=>{ const it = S.categories[key].items.find(i=>i.id===inp.dataset.editlbl); if(it) it.label = inp.value.trim()||it.label; });
      const n = document.getElementById("catName")?.value?.trim(); const ic = document.getElementById("catIcon")?.value?.trim();
      if(n) S.categories[key].label = n; if(ic) S.categories[key].icon = ic; if(sheet.color) S.categories[key].color = sheet.color;
      save(); sheet=null; render();
    });
    const delBtn = document.getElementById("deleteCatBtn");
    if(delBtn) delBtn.addEventListener("click",()=>{ if(confirm(`Delete "${S.categories[key].label}"?`)){ delete S.categories[key]; save(); sheet=null; render(); } });
  }
  if(sheet?.type==="addCat"){
    const doneBtn = document.getElementById("sheetSave");
    if(doneBtn) doneBtn.addEventListener("click",()=>{
      const n = document.getElementById("catName")?.value?.trim(); const ic = document.getElementById("catIcon")?.value?.trim()||"📁";
      if(!n) return; const k = uid(); S.categories[k] = {label:n,icon:ic,color:sheet.color||"#0a84ff",items:[]};
      save(); sheet=null; render();
    });
  }
  if(sheet?.type==="editOne" || sheet?.type==="addOne"){
    app.querySelectorAll("[data-pickmonth]").forEach(d=>d.addEventListener("click",()=>{
      sheet.month = d.dataset.pickmonth;
      app.querySelectorAll("[data-pickmonth]").forEach(x=>x.classList.toggle("active",x.dataset.pickmonth===sheet.month));
    }));
    const doneBtn = document.getElementById("sheetSave");
    if(doneBtn) doneBtn.addEventListener("click",()=>{
      const label = document.getElementById("oneLabel")?.value?.trim(); const amount = clamp(document.getElementById("oneAmount")?.value);
      if(!label) return;
      if(sheet.type==="editOne"){ const e = S.oneTimeExpenses.find(x=>x.id===sheet.id); if(e){ e.label=label; e.amount=amount; e.month=sheet.month||e.month; } }
      else { S.oneTimeExpenses.push({id:uid(),label,amount,month:sheet.month||S.activeMonth}); }
      save(); sheet=null; render();
    });
    const delBtn = document.getElementById("deleteOneBtn");
    if(delBtn) delBtn.addEventListener("click",()=>{ S.oneTimeExpenses = S.oneTimeExpenses.filter(x=>x.id!==sheet.id); save(); sheet=null; render(); });
  }
  if(sheet?.type==="addGoalItem" || sheet?.type==="editGoalItem"){
    const doneBtn = document.getElementById("sheetSave");
    if(doneBtn) doneBtn.addEventListener("click",()=>{
      const label = document.getElementById("giLabel")?.value?.trim(); const amount = clamp(document.getElementById("giAmount")?.value);
      const estimate = document.getElementById("giEstimate")?.value?.trim()||"";
      if(!label) return;
      if(sheet.type==="editGoalItem"){ const e = S.goalExpenses.find(x=>x.id===sheet.id); if(e){ e.label=label; e.amount=amount; e.estimate=estimate; } }
      else { S.goalExpenses.push({id:uid(),label,amount,estimate}); }
      save(); sheet=null; render();
    });
    const delBtn = document.getElementById("deleteGoalItemBtn");
    if(delBtn) delBtn.addEventListener("click",()=>{ S.goalExpenses = S.goalExpenses.filter(x=>x.id!==sheet.id); save(); sheet=null; render(); });
  }
  if(sheet?.type==="addMonth"){
    const doneBtn = document.getElementById("sheetSave");
    if(doneBtn) doneBtn.addEventListener("click",()=>{
      const next = sheet._nextMonth; const inc = document.getElementById("newMonthIncome")?.value;
      if(inc && clamp(inc)!==S.income){ S.monthOverrides[next] = {...(S.monthOverrides[next]||{}), income:clamp(inc)}; }
      else { S.monthOverrides[next] = S.monthOverrides[next] || {}; }
      S.activeMonth = next; save(); sheet=null; render();
    });
  }
  if(sheet?.type==="editGoalName"){
    const doneBtn = document.getElementById("sheetSave");
    if(doneBtn) doneBtn.addEventListener("click",()=>{ const v = document.getElementById("goalNameInput")?.value?.trim(); if(v) S.goalLabel = v; save(); sheet=null; render(); });
  }
  if(sheet?.type==="editGoalMonth"){
    app.querySelectorAll("[data-pickgoalmonth]").forEach(d=>d.addEventListener("click",()=>{ S.goalMonth = d.dataset.pickgoalmonth; save(); sheet=null; render(); }));
    const doneBtn = document.getElementById("sheetSave"); if(doneBtn) doneBtn.addEventListener("click",()=>{sheet=null;render();});
  }
  if(sheet?.type==="editGoalAmount"){
    const doneBtn = document.getElementById("sheetSave");
    if(doneBtn) doneBtn.addEventListener("click",()=>{ S.furnitureGoal = clamp(document.getElementById("goalAmountInput")?.value); save(); sheet=null; render(); });
  }
}

render();
</script>
</body>
</html>
