/* TOAST */

#toast{

/* -------------------------------------------------

------------------------------------------------- */

function clone(x){
  return JSON.parse(JSON.stringify(x));
}

function uid(){
  return "id_"+Math.random().toString(36).slice(2)+Date.now().toString(36);
}

function n(v){
  const x=parseFloat(v);
  return Number.isFinite(x)?x:0;
}

function money(v){
  return n(v).toLocaleString("en-US",{
    style:"currency",
    currency:"USD",
    minimumFractionDigits:2
  });
}

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function monthKey(date){
  return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0");
}

function shiftMonth(ym,delta){
  const [y,m]=ym.split("-").map(Number);
  return monthKey(new Date(y,m-1+delta,1));
}

function monthLabel(ym){
  const [y,m]=ym.split("-").map(Number);
  return new Date(y,m-1,1).toLocaleDateString("en-US",{
    month:"long",
    year:"numeric"
  });
}

function shortMonth(ym){
  const [y,m]=ym.split("-").map(Number);
  return new Date(y,m-1,1).toLocaleDateString("en-US",{
    month:"short",
    year:"numeric"
  });
}

/* -------------------------------------------------
   MONTH ARCHITECTURE
------------------------------------------------- */

function normalizeBudget(budget){

  const defaults=clone(DEFAULT_CATEGORIES);

  const result={};

  Object.keys(defaults).forEach(key=>{

    const source=budget?.[key]||defaults[key];

    result[key]={
      label:source.label||defaults[key].label,
      color:source.color||defaults[key].color,
      icon:source.icon||defaults[key].icon,

      items:Array.isArray(source.items)
        ?source.items.map(item=>({
            id:item.id||uid(),
            label:item.label||"Item",
            amount:n(item.amount)
          }))
        :[]
    };
  });

  /* Preserve any custom categories */

  Object.keys(budget||{}).forEach(key=>{

    if(result[key])return;

    const source=budget[key];

    result[key]={
      label:source.label||key,
      color:source.color||"#0a84ff",
      icon:source.icon||"📁",

      items:Array.isArray(source.items)
        ?source.items.map(item=>({
            id:item.id||uid(),
            label:item.label||"Item",
            amount:n(item.amount)
          }))
        :[]
    };
  });

  return result;
}

function ensureMonth(ym){

  if(!S.monthBudgets){
    S.monthBudgets={};
  }

  if(S.monthBudgets[ym]){
    return;
  }

  const existing=allMonthsRaw()
    .filter(m=>m<ym)
    .sort();

  const previous=
    existing.length
      ?existing[existing.length-1]
      :null;

  if(previous && S.monthBudgets[previous]){

    /*
      IMPORTANT:
      This copies the previous budget only
      when a month is created for the first time.
    */

    S.monthBudgets[ym]=
      clone(S.monthBudgets[previous]);

  }else{

    S.monthBudgets[ym]=
      normalizeBudget(S.categories);
  }
}

function ensureAllMonths(){

  const months=allMonthsRaw().sort();

  let previous=null;

  months.forEach(ym=>{

    if(!S.monthBudgets[ym]){

      if(previous && S.monthBudgets[previous]){

        S.monthBudgets[ym]=
          clone(S.monthBudgets[previous]);

      }else{

        S.monthBudgets[ym]=
          normalizeBudget(S.categories);
      }
    }

    previous=ym;
  });
}

function allMonthsRaw(){

  const set=new Set(INITIAL_MONTHS);

  Object.keys(S?.monthBudgets||{})
    .forEach(m=>set.add(m));

  Object.keys(S?.monthOverrides||{})
    .forEach(m=>set.add(m));

  (S?.oneTimeExpenses||[])
    .forEach(e=>{
      if(e.month)set.add(e.month);
    });

  if(S?.goalMonth){
    set.add(S.goalMonth);
  }

  return [...set];
}

function allMonths(){
  return allMonthsRaw().sort();
}

function categoryBudget(ym){
  ensureMonth(ym);
  return S.monthBudgets[ym];
}

/* -------------------------------------------------
   CALCULATIONS
------------------------------------------------- */

function categoryTotal(ym,category){

  return (category?.items||[])
    .reduce(
      (sum,item)=>sum+n(item.amount),
      0
    );
}

function recurringSpending(ym){

  const budget=categoryBudget(ym);

  return Object.entries(budget)
    .filter(([key])=>key!=="investing")
    .reduce(
      (sum,[,category])=>
        sum+categoryTotal(ym,category),
      0
    );
}

function investmentSpending(ym){

  return categoryTotal(
    ym,
    categoryBudget(ym).investing
  );
}

function getMiscBudget(ym){

  const ov=S.monthOverrides?.[ym];

  if(
    ov &&
    Object.prototype.hasOwnProperty.call(
      ov,
      "miscBudget"
    )
  ){
    return n(ov.miscBudget);
  }

  return n(S.miscBudget);
}

function oneTimeTotal(ym){

  return (S.oneTimeExpenses||[])
    .filter(e=>e.month===ym)
    .reduce(
      (sum,e)=>sum+n(e.amount),
      0
    );
}

function baseIncome(ym){

  const ov=S.monthOverrides?.[ym];

  if(
    ov &&
    Object.prototype.hasOwnProperty.call(
      ov,
      "income"
    )
  ){
    return n(ov.income);
  }

  return n(S.income);
}

function extraIncome(ym){

  return (
    S.monthOverrides?.[ym]?.extraIncome||[]
  ).reduce(
    (sum,e)=>sum+n(e.amount),
    0
  );
}

function totalIncome(ym){
  return baseIncome(ym)+extraIncome(ym);
}

function totalSpending(ym){

  return recurringSpending(ym)
    +getMiscBudget(ym)
    +investmentSpending(ym)
    +oneTimeTotal(ym);
}

function monthlyNet(ym){
  return totalIncome(ym)-totalSpending(ym);
}

function startingBalance(ym){

  const months=allMonths();
  const index=months.indexOf(ym);

  if(index<=0)return 0;

  return endingBalance(months[index-1]);
}

function endingBalance(ym){

  return startingBalance(ym)+monthlyNet(ym);
}

/* -------------------------------------------------
   GOALS
------------------------------------------------- */

function goalTotal(){

  return (S.goalExpenses||[])
    .reduce(
      (sum,e)=>sum+n(e.amount),
      0
    );
}

function projectedGoalBalance(){

  let balance=0;

  allMonths().forEach(ym=>{

    if(ym<=S.goalMonth){

      balance=endingBalance(ym);
    }
  });

  return Math.max(0,balance);
}

function goalPercent(){

  const target=goalTotal();

  if(!target)return 0;

  return Math.min(
    100,
    Math.max(
      0,
      Math.round(
        projectedGoalBalance()/target*100
      )
    )
  );
}

/* -------------------------------------------------
   PAID TRACKING
------------------------------------------------- */

function paidKey(ym,type,id){
  return ym+"__"+type+"__"+id;
}

function isPaid(ym,type,id){
  return !!S.paidExpenses?.[paidKey(ym,type,id)];
}

function togglePaid(ym,type,id){

  if(!S.paidExpenses){
    S.paidExpenses={};
  }

  const key=paidKey(ym,type,id);

  S.paidExpenses[key]=
    !S.paidExpenses[key];

  save();
  render();
}

function getMonthPaymentStats(ym){

  let total=0;
  let paid=0;
  let count=0;
  let paidCount=0;

  const budget=categoryBudget(ym);

  Object.entries(budget).forEach(([key,c])=>{

    if(key==="investing")return;

    (c.items||[]).forEach(item=>{

      const amount=n(item.amount);

      if(amount<=0)return;

      total+=amount;
      count++;

      if(isPaid(ym,"recurring",key+"__"+item.id)){

        paid+=amount;
        paidCount++;
      }
    });
  });

  const misc=getMiscBudget(ym);

  if(misc>0){

    total+=misc;
    count++;

    if(isPaid(ym,"misc","misc")){
      paid+=misc;
      paidCount++;
    }
  }

  (S.oneTimeExpenses||[])
    .filter(e=>e.month===ym)
    .forEach(e=>{

      const amount=n(e.amount);

      if(amount<=0)return;

      total+=amount;
      count++;

      if(isPaid(ym,"one",e.id)){

        paid+=amount;
        paidCount++;
      }
    });

  const pct=
    total>0
      ?Math.round(paid/total*100)
      :0;

  return {
    total,
    paid,
    outstanding:Math.max(0,total-paid),
    count,
    paidCount,
    unpaidCount:Math.max(0,count-paidCount),
    pct
  };
}

------------------------------------------------- */

function findStoredState(){

  try{

    const current=
      localStorage.getItem(SAVE_KEY);

    if(current){
      return JSON.parse(current);
    }

    for(const key of LEGACY_SAVE_KEYS){

      const raw=
        localStorage.getItem(key);

      if(raw){

        return JSON.parse(raw);
      }
    }

  }catch(err){

    console.error(
      "Storage read error",
      err
    );
  }

  return null;
}

function upsertLegacyItem(
  budget,
  categoryKey,
  id,
  label,
  amount
){

  if(!budget[categoryKey]){
    budget[categoryKey]=
      clone(DEFAULT_CATEGORIES[categoryKey]);
  }

  const items=
    budget[categoryKey].items ||
    (budget[categoryKey].items=[]);

  const existingById=
    items.find(i=>i.id===id);

  if(existingById){

    existingById.amount=amount;
    existingById.label=label;

    return;
  }

  const existingBySignature=
    items.find(
      i=>
        i.label===label &&
        n(i.amount)===amount
    );

  if(existingBySignature){
    return;
  }

  items.push({
    id,
    label,
    amount
  });
}

function migrateState(state){

  const defaults=clone(DEFAULT_STATE);

  state.tab=
    state.tab||defaults.tab;

  state.activeMonth=
    state.activeMonth||defaults.activeMonth;

  state.goalMonth=
    state.goalMonth||defaults.goalMonth;

  state.goalLabel=
    state.goalLabel||defaults.goalLabel;

  state.income=
    state.income===undefined
      ?DEFAULT_INCOME
      :n(state.income);

  state.miscBudget=
    state.miscBudget===undefined
      ?1000
      :n(state.miscBudget);

  state.categories=
    state.categories ||
    clone(DEFAULT_CATEGORIES);

  state.monthBudgets=
    state.monthBudgets||{};

  state.monthOverrides=
    state.monthOverrides||{};

  state.oneTimeExpenses=
    Array.isArray(state.oneTimeExpenses)
      ?state.oneTimeExpenses
      :[];

  state.goalExpenses=
    Array.isArray(state.goalExpenses)
      ?state.goalExpenses
      :clone(DEFAULT_GOALS);

  state.checklist=
    Array.isArray(state.checklist)
      ?state.checklist
      :clone(DEFAULT_CHECKLIST);

  state.paidExpenses=
    state.paidExpenses||{};

  state.meta=
    state.meta||{};

  /*
    If the old v2 architecture exists,
    September may already contain the original
    Tesla/Phone/Streaming categories.
    Convert that data into the new categories
    without deleting user data.
  */

  const sep=
    state.monthBudgets["2026-09"];

  if(sep){

    if(sep.tesla){

      (sep.tesla.items||[]).forEach(item=>{

        upsertLegacyItem(
          sep,
          "transportation",
          "migrated_"+item.id,
          item.label,
          n(item.amount)
        );
      });
    }

    if(sep.phone){

      (sep.phone.items||[]).forEach(item=>{

        upsertLegacyItem(
          sep,
          "utilities",
          "migrated_phone_"+item.id,
          item.label,
          n(item.amount)
        );
      });
    }

    if(sep.streaming){

      (sep.streaming.items||[]).forEach(item=>{

        upsertLegacyItem(
          sep,
          "subscriptions",
          "migrated_stream_"+item.id,
          item.label,
          n(item.amount)
        );
      });
    }

    if(sep.transportation){

      (sep.transportation.items||[]).forEach(item=>{

        upsertLegacyItem(
          sep,
          "transportation",
          "migrated_transport_"+item.id,
          item.label,
          n(item.amount)
        );
      });
    }

    state.monthBudgets["2026-09"]=
      normalizeBudget(sep);
  }

  /*
    Legacy month-specific system can already
    contain values. Keep them intact.
  */

  INITIAL_MONTHS.forEach(ym=>{

    if(!state.monthBudgets[ym]){

      const previous=
        INITIAL_MONTHS
          .filter(m=>m<ym)
          .sort()
          .pop();

      if(previous && state.monthBudgets[previous]){

        state.monthBudgets[ym]=
          clone(state.monthBudgets[previous]);

      }
    }
  });

  return state;
}

function loadState(){

  const stored=findStoredState();

  if(stored){

    const defaults=clone(DEFAULT_STATE);

    S={
      ...defaults,
      ...stored,

      categories:
        stored.categories ||
        defaults.categories,

      monthBudgets:
        stored.monthBudgets ||
        {},

      monthOverrides:
        stored.monthOverrides ||
        {},

      oneTimeExpenses:
        stored.oneTimeExpenses ||
        [],

      goalExpenses:
        stored.goalExpenses ||
        defaults.goalExpenses,

      checklist:
        stored.checklist ||
        defaults.checklist,

      paidExpenses:
        stored.paidExpenses ||
        {}
    };

    migrateState(S);

  }else{

    S=clone(DEFAULT_STATE);
  }

  seedLegacyData();
  ensureAllMonths();

  try{

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(S)
    );

  }catch(err){

    console.error(
      "Initial save error",
      err
    );
  }
}

function save(){

  clearTimeout(saveTimer);

  saveTimer=setTimeout(()=>{

    try{

      localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(S)
      );

      showToast("✓ Saved");

    }catch(err){

      console.error(err);

      showToast("Could not save");
    }

  },250);
}

              <div class="row">

                <button
                  class="payment-button"

                  data-paid-type="one"

){

      id="sheet-bg"
    >

      <div class="sheet">

          </div>

}

   SHEETS
------------------------------------------------- */

function renderSheet(){

  if(!sheet)return "";

  /* INCOME */

  if(sheet.type==="income"){

    const ym=sheet.month;

    const extras=
      S.monthOverrides?.[ym]?.extraIncome||[];

    return sheetShell(
      monthLabel(ym),

      `

        <div class="field">

          <div class="field-label">
            Base Monthly Income
          </div>

          <div class="field-box">

            <input
              id="income-input"
              type="number"
              step="0.01"
              value="${baseIncome(ym).toFixed(2)}"
            >

          </div>

        </div>

        <div class="field">

          <div class="field-label">
            Extra Income
          </div>

          <div class="group">

            ${extras.map(e=>`

              <div
                class="row"
                data-edit-extra="${esc(e.id)}"
              >

                <div class="row-label">
                  ${esc(e.label)}
                </div>

                <div class="row-value">
                  ${money(e.amount)}
                </div>

                <div class="chevron">›</div>

              </div>

            `).join("")}

            <button
              class="add-row"
              data-add-extra
            >
              ＋ Add Extra Income
            </button>

          </div>

        </div>

        <div class="callout">

          Income is independent by month.
          Changing ${esc(shortMonth(ym))}
          will not change another month.

        </div>

      `
    );
  }

  /* EXTRA INCOME */

  if(sheet.type==="extra"){

    const ym=sheet.month;

    const e=
      sheet.id
      ?(
        S.monthOverrides?.[ym]?.extraIncome||[]
      ).find(x=>x.id===sheet.id)
      :null;

    const danger=sheet.id
      ?`
        <button
          class="delete-button"
          data-delete-extra
        >
          Delete Extra Income
        </button>
      `
      :"";

    return sheetShell(
      sheet.id
        ?"Edit Extra Income"
        :"Extra Income",

      `

        <div class="field">

          <div class="field-label">
            Description
          </div>

          <div class="field-box">

            <input
              id="extra-label"
              type="text"
              value="${esc(e?.label||"")}"
              placeholder="Income source"
            >

          </div>

        </div>

        <div class="field">

          <div class="field-label">
            Amount
          </div>

          <div class="field-box">

            <input
              id="extra-amount"
              type="number"
              step="0.01"
              value="${n(e?.amount||0).toFixed(2)}"
            >

          </div>

        </div>

      `,
      "Done",
      danger
    );
  }

  /* CATEGORY */

  if(sheet.type==="category"){

    const ym=sheet.month;
    const key=sheet.key;
    const c=categoryBudget(ym)[key];

    return sheetShell(
      c.label,

      `

        <div class="field">

          <div class="field-label">
            Category Name
          </div>

          <div class="field-box">

            <input
              id="cat-name"
              type="text"
              value="${esc(c.label)}"
            >

          </div>

        </div>

        <div class="field">

          <div class="field-label">
            Icon
          </div>

          <div class="field-box">

            <input
              id="cat-icon"
              type="text"
              value="${esc(c.icon||"")}"
            >

          </div>

        </div>

        <div class="field">

          <div class="field-label">
            Color
          </div>

          <div class="color-grid">

            ${COLORS.map(color=>`

              <button
                class="color-dot ${
                  c.color===color
                    ?"selected"
                    :""
                }"
                style="background:${color}"
                data-color="${color}"
              ></button>

            `).join("")}

          </div>

        </div>

        <div class="field">

          <div class="field-label">
            Items
          </div>

          <div class="group">

            ${(c.items||[]).map(item=>`

              <div class="row">

                <input
                  class="text-input"
                  value="${esc(item.label)}"
                  data-item-label="${esc(item.id)}"
                >

                <button
                  style="
                    color:var(--red);
                    font-size:22px;
                  "
                  data-delete-item="${esc(item.id)}"
                >
                  ×
                </button>

              </div>

            `).join("")}

            <div class="row">

              <input
                id="new-item"
                class="text-input"
                placeholder="New item"
              >

              <button
                style="
                  color:var(--blue);
                  font-weight:600;
                "
                data-add-item
              >
                Add
              </button>

            </div>

          </div>

        </div>

        <div class="callout">

          These values belong only to
          <strong>${esc(shortMonth(ym))}</strong>.

          Other months have their own copy.

        </div>

      `,
      "Done"
    );
  }

  /* ONE-TIME EXPENSE */

  if(sheet.type==="one"){

    const e=
      sheet.id
      ?S.oneTimeExpenses.find(
        x=>x.id===sheet.id
      )
      :null;

    const danger=sheet.id
      ?`
        <button
          class="delete-button"
          data-delete-one
        >
          Delete Expense
        </button>
      `
      :"";

    return sheetShell(
      sheet.id
        ?"Edit Expense"
        :"One-Time Expense",

      `

        <div class="field">

          <div class="field-label">
            Description
          </div>

          <div class="field-box">

            <input
              id="one-label"
              type="text"
              value="${esc(e?.label||"")}"
              placeholder="Expense"
            >

          </div>

        </div>

        <div class="field">

          <div class="field-label">
            Amount
          </div>

          <div class="field-box">

            <input
              id="one-amount"
              type="number"
              step="0.01"
              value="${n(e?.amount||0).toFixed(2)}"
            >

          </div>

        </div>

        <div class="field">

          <div class="field-label">
            Month
          </div>

          <div class="month-scroll" style="padding:0">

            ${allMonths().map(m=>`

              <button
                class="month-chip ${
                  (sheet.month||S.activeMonth)===m
                    ?"active"
                    :""
                }"
                data-one-month="${esc(m)}"
              >
                ${esc(shortMonth(m))}
              </button>

            `).join("")}

          </div>

        </div>

      `,
      "Done",
      danger
    );
  }

  /* GOAL ITEM */

  if(sheet.type==="goalItem"){

    const e=
      sheet.id
      ?S.goalExpenses.find(
        x=>x.id===sheet.id
      )
      :null;

    const danger=sheet.id
      ?`
        <button
          class="delete-button"
          data-delete-goal
        >
          Delete Goal Item
        </button>
      `
      :"";

    return sheetShell(
      sheet.id
        ?"Edit Goal Item"
        :"Goal Item",

      `

        <div class="field">

          <div class="field-label">
            Name
          </div>

          <div class="field-box">

            <input
              id="goal-item-label"
              type="text"
              value="${esc(e?.label||"")}"
              placeholder="Goal expense"
            >

          </div>

        </div>

        <div class="field">

          <div class="field-label">
            Amount
          </div>

          <div class="field-box">

            <input
              id="goal-item-amount"
              type="number"
              step="0.01"
              value="${n(e?.amount||0).toFixed(2)}"
            >

          </div>

        </div>

        <div class="field">

          <div class="field-label">
            Note
          </div>

          <div class="field-box">

            <input
              id="goal-item-note"
              type="text"
              value="${esc(e?.estimate||"")}"
              placeholder="Optional"
            >

          </div>

        </div>

      `,
      "Done",
      danger
    );
  }

  /* GOAL NAME */

  if(sheet.type==="goalName"){

    return sheetShell(
      "Goal Name",

      `

        <div class="field">

          <div class="field-label">
            Name
          </div>

          <div class="field-box">

            <input
              id="goal-name"
              type="text"
              value="${esc(S.goalLabel)}"
            >

          </div>

        </div>

      `
    );
  }

  /* GOAL MONTH */

  if(sheet.type==="goalMonth"){

    return sheetShell(
      "Target Month",

      `

        <div class="field">

          <div class="month-scroll" style="padding:0">

            ${allMonths().map(m=>`

              <button
                class="month-chip ${
                  m===S.goalMonth
                    ?"active"
                    :""
                }"
                data-goal-month="${esc(m)}"
              >
                ${esc(shortMonth(m))}
              </button>

            `).join("")}

          </div>

        </div>

      `
    );
  }

  /* GOAL AMOUNT */

  if(sheet.type==="goalAmount"){

    return sheetShell(
      "Target Amount",

      `

        <div class="field">

          <div class="field-label">
            Goal Target
          </div>

          <div class="field-box">

            <input
              id="goal-amount"
              type="number"
              step="0.01"
              value="${goalTotal().toFixed(2)}"
            >

          </div>

        </div>

        <div class="callout">

          This changes the total goal target
          while keeping your individual goal
          items intact as much as possible.

        </div>

      `
    );
  }

  /* MONTHS */

  if(sheet.type==="months"){

    const months=allMonths();

    return sheetShell(
      "Months",

      `

        <div class="callout" style="margin-bottom:18px">

          Each month has its own budget.

          A new month starts by copying the
          previous month's budget once.

          After creation, the months are
          completely independent.

        </div>

        <div class="group">

          ${months.map((ym,index)=>{

            const canRemove=
              months.length>1 &&
              ym!==APP_START;

            return `

              <div class="row">

                <div
                  class="row-label"
                  data-select-month="${esc(ym)}"
                >

                  ${esc(monthLabel(ym))}

                  <div class="row-sub">

                    Start
                    ${money(startingBalance(ym))}
                    · Net
                    ${money(monthlyNet(ym))}
                    · End
                    ${money(endingBalance(ym))}

                  </div>

                </div>

                <div class="row-value ${
                  endingBalance(ym)<0
                    ?"balance-negative"
                    :"balance-positive"
                }">
                  ${money(endingBalance(ym))}
                </div>

                ${
                  canRemove
                  ?`
                    <button
                      class="remove-month"
                      data-remove-month="${esc(ym)}"
                    >
                      Remove
                    </button>
                  `
                  :`
                    <div class="chevron">›</div>
                  `
                }

              </div>

            `;
          }).join("")}

          <button
            class="add-row"
            data-add-month
          >
            ＋ Add Next Month
          </button>

        </div>

        <div class="danger-callout">

          Removing a month removes that month's
          budget and month-specific data.
          Your other months remain unchanged.

        </div>

      `
    );
  }

  /* ADD MONTH */

  if(sheet.type==="addMonth"){

    const next=sheet.next;
    const previous=shiftMonth(next,-1);

    return sheetShell(
      "Add Month",

      `

        <div class="callout" style="margin-bottom:20px">

          ${esc(monthLabel(next))}
          will start with a copy of
          ${esc(monthLabel(previous))}.

          After creation, you can change this
          month's expenses without changing
          the previous month.

        </div>

        <div class="field">

          <div class="field-label">
            Base Income
          </div>

          <div class="field-box">

            <input
              id="new-month-income"
              type="number"
              step="0.01"
              value="${baseIncome(previous).toFixed(2)}"
            >

          </div>

        </div>

      `
    );
  }

  /* CHECKLIST */

  if(sheet.type==="checklist"){

    return sheetShell(
      "Checklist",

      `

        <div class="group">

          ${(S.checklist||[]).map(item=>`

            <div
              class="row"
              data-toggle-check="${esc(item.id)}"
            >

              <div
                class="check ${
                  item.done
                    ?"done"
                    :""
                }"
              >
                ${item.done?"✓":""}
              </div>

              <div
                class="row-label ${
                  item.done
                    ?"strike"
                    :""
                }"
              >
                ${esc(item.label)}
              </div>

              <button
                style="
                  color:var(--red);
                  font-size:22px;
                "
                data-delete-check="${esc(item.id)}"
              >
                ×
              </button>

            </div>

          `).join("")}

          <div class="row">

            <input
              id="new-check"
              class="text-input"
              placeholder="Add checklist item"
            >

            <button
              style="
                color:var(--blue);
                font-weight:600;
              "
              data-add-check
            >
              Add
            </button>

          </div>

        </div>

      `
    );
  }

  /* SETTINGS */

  if(sheet.type==="settings"){

    return sheetShell(
      "Settings",

      `

        <div class="field">

          <div class="field-label">
            Default Monthly Income
          </div>

          <div class="field-box">

            <input
              id="settings-income"
              type="number"
              step="0.01"
              value="${n(S.income).toFixed(2)}"
            >

          </div>

        </div>

        <div class="field">

          <div class="field-label">
            Default Misc Buffer
          </div>

          <div class="field-box">

            <input
              id="settings-misc"
              type="number"
              step="0.01"
              value="${n(S.miscBudget).toFixed(2)}"
            >

          </div>

        </div>

        <div class="callout">

          These are defaults for future months.

          Existing months keep their own
          saved values.

        </div>

      `,
      "Save"
    );
  }

  return "";
}

/* -------------------------------------------------
   EVENTS
------------------------------------------------- */

function bindEvents(){

  /* Tabs */

  document.querySelectorAll("[data-tab]")
    .forEach(btn=>{

      btn.onclick=()=>{

        S.tab=btn.dataset.tab;

        fabOpen=false;
        sheet=null;

        save();
        render();
      };
    });

  /* Month chips */

  document.querySelectorAll(
    ".nav [data-month]"
  ).forEach(btn=>{

    btn.onclick=()=>{

      S.activeMonth=
        btn.dataset.month;

      fabOpen=false;
      sheet=null;

      ensureMonth(S.activeMonth);

      save();
      render();
    };
  });

  /* Month arrows */

  document.querySelectorAll(
    "[data-nav-month]"
  ).forEach(btn=>{

    btn.onclick=()=>{

      const target=
        btn.dataset.navMonth;

      if(!target)return;

      S.activeMonth=target;

      ensureMonth(target);

      save();
      render();
    };
  });

  /* Categories */

  document.querySelectorAll(
    "[data-category]"
  ).forEach(btn=>{

    btn.onclick=()=>{

      const key=
        btn.dataset.category;

      sheet={
        type:"category",
        month:S.activeMonth,
        key
      };

      render();
    };
  });

  document.querySelectorAll(
    "[data-edit-category]"
  ).forEach(btn=>{

    btn.onclick=()=>{

      sheet={
        type:"category",
        month:S.activeMonth,
        key:btn.dataset.editCategory
      };

      render();
    };
  });

  /* Amounts */

  document.querySelectorAll(
    "[data-amount]"
  ).forEach(input=>{

    input.onchange=()=>{

      const ym=S.activeMonth;
      const key=input.dataset.amount;
      const id=input.dataset.item;

      const item=
        categoryBudget(ym)
          [key]
          ?.items
          ?.find(x=>x.id===id);

      if(item){

        item.amount=
          n(input.value);

        save();
        render();
      }
    };
  });

  /* Misc */

  const misc=
    document.querySelector("[data-misc]");

  if(misc){

    misc.onchange=()=>{

      const ov=
        S.monthOverrides[S.activeMonth] ||
        (S.monthOverrides[S.activeMonth]={});

      ov.miscBudget=
        n(misc.value);

      save();
      render();
    };
  }

  /* Paid */

  document.querySelectorAll(
    "[data-toggle-paid]"
  ).forEach(btn=>{

    btn.onclick=e=>{

      e.stopPropagation();

      togglePaid(
        S.activeMonth,
        btn.dataset.paidType,
        btn.dataset.paidId
      );
    };
  });

  /* One-time edit */

  document.querySelectorAll(
    "[data-edit-one]"
  ).forEach(btn=>{

    btn.onclick=()=>{

      const e=
        S.oneTimeExpenses.find(
          x=>x.id===btn.dataset.editOne
        );

      if(!e)return;

      sheet={
        type:"one",
        id:e.id,
        month:e.month
      };

      render();
    };
  });

  const addOne=
    document.querySelector("[data-add-one]");

  if(addOne){

    addOne.onclick=()=>{

      sheet={
        type:"one",
        month:S.activeMonth
      };

      render();
    };
  }

  /* Goal items */

  document.querySelectorAll(
    "[data-goal-item]"
  ).forEach(btn=>{

    btn.onclick=()=>{

      sheet={
        type:"goalItem",
        id:btn.dataset.goalItem
      };

      render();
    };
  });

  const addGoal=
    document.querySelector("[data-add-goal]");

  if(addGoal){

    addGoal.onclick=()=>{

      sheet={
        type:"goalItem"
      };

      render();
    };
  }

  /* Goal settings */

  document.querySelectorAll(
    "[data-goal-setting]"
  ).forEach(btn=>{

    btn.onclick=()=>{

      const type=
        btn.dataset.goalSetting;

      if(type==="name"){
        sheet={type:"goalName"};
      }

      if(type==="month"){
        sheet={type:"goalMonth"};
      }

      if(type==="amount"){
        sheet={type:"goalAmount"};
      }

      render();
    };
  });

  /* Income */

  document.querySelectorAll(
    "[data-income]"
  ).forEach(btn=>{

    btn.onclick=()=>{

      sheet={
        type:"income",
        month:S.activeMonth
      };

      render();
    };
  });

  /* More */

  const openMonths=
    document.querySelector("[data-open-months]");

  if(openMonths){

    openMonths.onclick=()=>{

      sheet={type:"months"};

      render();
    };
  }

  const openChecklist=
    document.querySelector("[data-open-checklist]");

  if(openChecklist){

    openChecklist.onclick=()=>{

      sheet={type:"checklist"};

      render();
    };
  }

  const openSettings=
    document.querySelector("[data-open-settings]");

  if(openSettings){

    openSettings.onclick=()=>{

      sheet={type:"settings"};

      render();
    };
  }

  /* Month summaries */

  document.querySelectorAll(
    "[data-month-summary]"
  ).forEach(btn=>{

    btn.onclick=()=>{

      S.activeMonth=
        btn.dataset.monthSummary;

      save();
      render();
    };
  });

  /* FAB */

  const fabToggle=
    document.querySelector("[data-fab-toggle]");

  if(fabToggle){

    fabToggle.onclick=()=>{

      fabOpen=!fabOpen;

      render();
    };
  }

  const closeFab=
    document.querySelector("[data-close-fab]");

  if(closeFab){

    closeFab.onclick=()=>{

      fabOpen=false;

      render();
    };
  }

  document.querySelectorAll(
    "[data-fab]"
  ).forEach(btn=>{

    btn.onclick=()=>{

      const type=
        btn.dataset.fab;

      fabOpen=false;

      if(type==="extra"){

        sheet={
          type:"extra",
          month:S.activeMonth
        };
      }

      if(type==="expense"){

        sheet={
          type:"one",
          month:S.activeMonth
        };
      }

      if(type==="investment"){

        S.tab="investing";

        save();
        render();

        return;
      }

      if(type==="goal"){

        sheet={
          type:"goalItem"
        };
      }

      if(type==="check"){

        sheet={
          type:"checklist"
        };
      }

      render();
    };
  });

  /* Sheet */

  bindSheetEvents();
}

/* -------------------------------------------------
   SHEET EVENTS
------------------------------------------------- */

function bindSheetEvents(){

  const cancel=
    document.querySelector(
      "[data-sheet-cancel]"
    );

  if(cancel){

    cancel.onclick=()=>{

      sheet=null;

      render();
    };
  }

  const bg=
    document.getElementById("sheet-bg");

  if(bg){

    bg.onclick=e=>{

      if(e.target===bg){

        sheet=null;

        render();
      }
    };
  }

  const saveBtn=
    document.querySelector(
      "[data-sheet-save]"
    );

  if(saveBtn){

    saveBtn.onclick=saveSheet;
  }

  /* Income */

  if(sheet?.type==="income"){

    const addExtra=
      document.querySelector(
        "[data-add-extra]"
      );

    if(addExtra){

      addExtra.onclick=()=>{

        sheet={
          type:"extra",
          month:sheet.month
        };

        render();
      };
    }

    document.querySelectorAll(
      "[data-edit-extra]"
    ).forEach(btn=>{

      btn.onclick=()=>{

        sheet={
          type:"extra",
          id:btn.dataset.editExtra,
          month:sheet.month
        };

        render();
      };
    });
  }

  /* Extra income */

  if(sheet?.type==="extra"){

    const del=
      document.querySelector(
        "[data-delete-extra]"
      );

    if(del){

      del.onclick=()=>{

        const list=
          S.monthOverrides?.[sheet.month]
            ?.extraIncome || [];

        if(S.monthOverrides[sheet.month]){

          S.monthOverrides[sheet.month]
            .extraIncome=
            list.filter(
              e=>e.id!==sheet.id
            );
        }

        save();

        sheet={
          type:"income",
          month:sheet.month
        };

        render();
      };
    }
  }

  /* Category */

  if(sheet?.type==="category"){

    document.querySelectorAll(
      "[data-color]"
    ).forEach(btn=>{

      btn.onclick=()=>{

        sheet.color=
          btn.dataset.color;

        document.querySelectorAll(
          "[data-color]"
        ).forEach(x=>{

          x.classList.toggle(
            "selected",
            x.dataset.color===sheet.color
          );
        });
      };
    });

    document.querySelectorAll(
      "[data-delete-item]"
    ).forEach(btn=>{

      btn.onclick=()=>{

        const c=
          categoryBudget(sheet.month)
            [sheet.key];

        c.items=
          c.items.filter(
            i=>i.id!==btn.dataset.deleteItem
          );

        save();
        render();
      };
    });

    const add=
      document.querySelector(
        "[data-add-item]"
      );

    if(add){

      add.onclick=()=>{

        const input=
          document.getElementById(
            "new-item"
          );

        const value=
          input?.value?.trim();

        if(!value)return;

        categoryBudget(sheet.month)
          [sheet.key]
          .items
          .push({
            id:uid(),
            label:value,
            amount:0
          });

        save();
        render();
      };
    }
  }

  /* One-time */

  if(sheet?.type==="one"){

    document.querySelectorAll(
      "[data-one-month]"
    ).forEach(btn=>{

      btn.onclick=()=>{

        sheet.month=
          btn.dataset.oneMonth;

        document.querySelectorAll(
          "[data-one-month]"
        ).forEach(x=>{

          x.classList.toggle(
            "active",
            x.dataset.oneMonth===sheet.month
          );
        });
      };
    });

    const del=
      document.querySelector(
        "[data-delete-one]"
      );

    if(del){

      del.onclick=()=>{

        S.oneTimeExpenses=
          S.oneTimeExpenses.filter(
            e=>e.id!==sheet.id
          );

        Object.keys(
          S.paidExpenses||{}
        ).forEach(key=>{

          if(
            key.endsWith(
              "__one__"+sheet.id
            )
          ){
            delete S.paidExpenses[key];
          }
        });

        save();

        sheet=null;

        render();
      };
    }
  }

  /* Goal */

  if(sheet?.type==="goalItem"){

    const del=
      document.querySelector(
        "[data-delete-goal]"
      );

    if(del){

      del.onclick=()=>{

        S.goalExpenses=
          S.goalExpenses.filter(
            e=>e.id!==sheet.id
          );

        save();

        sheet=null;

        render();
      };
    }
  }

  /* Goal month */

  if(sheet?.type==="goalMonth"){

    document.querySelectorAll(
      "[data-goal-month]"
    ).forEach(btn=>{

      btn.onclick=()=>{

        S.goalMonth=
          btn.dataset.goalMonth;

        ensureAllMonths();

        save();

        sheet=null;

        render();
      };
    });
  }

  /* Months */

  if(sheet?.type==="months"){

    document.querySelectorAll(
      "[data-select-month]"
    ).forEach(btn=>{

      btn.onclick=()=>{

        S.activeMonth=
          btn.dataset.selectMonth;

        ensureMonth(
          S.activeMonth
        );

        save();

        sheet=null;

        render();
      };
    });

    const add=
      document.querySelector(
        "[data-add-month]"
      );

    if(add){

      add.onclick=()=>{

        const months=allMonths();

        const last=
          months[months.length-1];

        sheet={
          type:"addMonth",
          next:shiftMonth(last,1)
        };

        render();
      };
    }

    /* Remove month */

    document.querySelectorAll(
      "[data-remove-month]"
    ).forEach(btn=>{

      btn.onclick=e=>{

        e.stopPropagation();

        const ym=
          btn.dataset.removeMonth;

        if(ym===APP_START){

          showToast(
            "September 2026 cannot be removed"
          );

          return;
        }

        const months=allMonths();

        if(months.length<=1){

          showToast(
            "Keep at least one month"
          );

          return;
        }

        /*
          Remove only that month.
          No other month is modified.
        */

        delete S.monthBudgets[ym];

        delete S.monthOverrides[ym];

        S.oneTimeExpenses=
          S.oneTimeExpenses.filter(
            e=>e.month!==ym
          );

        /*
          Remove paid records belonging
          to the deleted month.
        */

        Object.keys(
          S.paidExpenses||{}
        ).forEach(key=>{

          if(key.startsWith(ym+"__")){

            delete S.paidExpenses[key];
          }
        });

        /*
          If the removed month was active,
          move to the previous available month.
        */

        if(S.activeMonth===ym){

          const remaining=
            allMonths();

          const fallback=
            remaining
              .filter(m=>m<ym)
              .pop() ||
            remaining[0];

          S.activeMonth=fallback;
        }

        /*
          If goal month was removed,
          move goal to the nearest remaining month.
        */

        if(S.goalMonth===ym){

          const remaining=
            allMonths();

          S.goalMonth=
            remaining.includes(APP_START)
              ?(
                remaining
                  .filter(m=>m<=S.activeMonth)
                  .pop() ||
                remaining[remaining.length-1]
              )
              :remaining[remaining.length-1];
        }

        save();

        sheet={
          type:"months"
        };

        render();

        showToast(
          monthLabel(ym)+" removed"
        );
      };
    });
  }

  /* Checklist */

  if(sheet?.type==="checklist"){

    document.querySelectorAll(
      "[data-toggle-check]"
    ).forEach(row=>{

      row.onclick=e=>{

        if(
          e.target.closest(
            "[data-delete-check]"
          )
        )return;

        const item=
          S.checklist.find(
            x=>x.id===row.dataset.toggleCheck
          );

        if(item){

          item.done=!item.done;

          save();
          render();
        }
      };
    });

    document.querySelectorAll(
      "[data-delete-check]"
    ).forEach(btn=>{

      btn.onclick=e=>{

        e.stopPropagation();

        S.checklist=
          S.checklist.filter(
            x=>x.id!==btn.dataset.deleteCheck
          );

        save();
        render();
      };
    });

    const add=
      document.querySelector(
        "[data-add-check]"
      );

    if(add){

      add.onclick=()=>{

        const input=
          document.getElementById(
            "new-check"
          );

        const value=
          input?.value?.trim();

        if(!value)return;

        S.checklist.push({
          id:uid(),
          label:value,
          done:false
        });

        save();
        render();
      };
    }
  }
}

/* -------------------------------------------------
   SAVE SHEET
------------------------------------------------- */

function saveSheet(){

  if(!sheet)return;

  /* INCOME */

  if(sheet.type==="income"){

    const value=
      document.getElementById(
        "income-input"
      )?.value;

    S.monthOverrides[sheet.month]=
      S.monthOverrides[sheet.month]||{};

    S.monthOverrides[sheet.month].income=
      n(value);

    save();

    sheet=null;

    render();

    return;
  }

  /* EXTRA */

  if(sheet.type==="extra"){

    const label=
      document.getElementById(
        "extra-label"
      )?.value?.trim();

    const amount=
      n(
        document.getElementById(
          "extra-amount"
        )?.value
      );

    if(!label)return;

    S.monthOverrides[sheet.month]=
      S.monthOverrides[sheet.month]||{};

    S.monthOverrides[sheet.month].extraIncome=
      S.monthOverrides[sheet.month].extraIncome||[];

    const list=
      S.monthOverrides[sheet.month].extraIncome;

    if(sheet.id){

      const e=
        list.find(x=>x.id===sheet.id);

      if(e){

        e.label=label;
        e.amount=amount;
      }

    }else{

      list.push({
        id:uid(),
        label,
        amount
      });
    }

    save();

    sheet={
      type:"income",
      month:sheet.month
    };

    render();

    return;
  }

  /* CATEGORY */

  if(sheet.type==="category"){

    const c=
      categoryBudget(sheet.month)
        [sheet.key];

    const name=
      document.getElementById(
        "cat-name"
      )?.value?.trim();

    const icon=
      document.getElementById(
        "cat-icon"
      )?.value?.trim();

    if(name)c.label=name;

    if(icon)c.icon=icon;

    if(sheet.color){
      c.color=sheet.color;
    }

    document.querySelectorAll(
      "[data-item-label]"
    ).forEach(input=>{

      const item=
        c.items.find(
          x=>x.id===input.dataset.itemLabel
        );

      if(item){

        const value=
          input.value.trim();

        if(value){
          item.label=value;
        }
      }
    });

    save();

    sheet=null;

    render();

    return;
  }

  /* ONE-TIME */

  if(sheet.type==="one"){

    const label=
      document.getElementById(
        "one-label"
      )?.value?.trim();

    const amount=
      n(
        document.getElementById(
          "one-amount"
        )?.value
      );

    if(!label)return;

    if(sheet.id){

      const e=
        S.oneTimeExpenses.find(
          x=>x.id===sheet.id
        );

      if(e){

        e.label=label;
        e.amount=amount;
        e.month=
          sheet.month||e.month;
      }

    }else{

      S.oneTimeExpenses.push({
        id:uid(),
        label,
        amount,
        month:
          sheet.month||
          S.activeMonth
      });
    }

    save();

    sheet=null;

    render();

    return;
  }

  /* GOAL ITEM */

  if(sheet.type==="goalItem"){

    const label=
      document.getElementById(
        "goal-item-label"
      )?.value?.trim();

    const amount=
      n(
        document.getElementById(
          "goal-item-amount"
        )?.value
      );

    const note=
      document.getElementById(
        "goal-item-note"
      )?.value?.trim()||"";

    if(!label)return;

    if(sheet.id){

      const e=
        S.goalExpenses.find(
          x=>x.id===sheet.id
        );

      if(e){

        e.label=label;
        e.amount=amount;
        e.estimate=note;
      }

    }else{

      S.goalExpenses.push({
        id:uid(),
        label,
        amount,
        estimate:note
      });
    }

    save();

    sheet=null;

    render();

    return;
  }

  /* GOAL NAME */

  if(sheet.type==="goalName"){

    const value=
      document.getElementById(
        "goal-name"
      )?.value?.trim();

    if(value){
      S.goalLabel=value;
    }

    save();

    sheet=null;

    render();

    return;
  }

  /* GOAL AMOUNT */

  if(sheet.type==="goalAmount"){

    const target=
      n(
        document.getElementById(
          "goal-amount"
        )?.value
      );

    const current=
      goalTotal();

    const difference=
      target-current;

    if(S.goalExpenses.length){

      const last=
        S.goalExpenses[
          S.goalExpenses.length-1
        ];

      last.amount=
        Math.max(
          0,
          n(last.amount)+difference
        );

    }else{

      S.goalExpenses.push({
        id:uid(),
        label:"Move Day Goal",
        amount:target,
        estimate:""
      });
    }

    save();

    sheet=null;

    render();

    return;
  }

  /* ADD MONTH */

  if(sheet.type==="addMonth"){

    const next=sheet.next;
    const previous=
      shiftMonth(next,-1);

    /*
      Create the month only once.
      The previous budget is copied once.
      Future edits are independent.
    */

    if(!S.monthBudgets[next]){

      ensureMonth(previous);

      S.monthBudgets[next]=
        clone(
          S.monthBudgets[previous]
        );
    }

    const income=
      n(
        document.getElementById(
          "new-month-income"
        )?.value
      );

    S.monthOverrides[next]=
      S.monthOverrides[next]||{};

    S.monthOverrides[next].income=
      income;

    S.activeMonth=next;

    save();

    sheet=null;

    render();

    return;
  }

  /* SETTINGS */

  if(sheet.type==="settings"){

    const income=
      n(
        document.getElementById(
          "settings-income"
        )?.value
      );

    const misc=
      n(
        document.getElementById(
          "settings-misc"
        )?.value
      );

    S.income=income;
    S.miscBudget=misc;

    save();

    sheet=null;

    render();

    return;
  }

  if(sheet.type==="months"){

    sheet=null;

    render();

    return;
  }

  if(sheet.type==="checklist"){

    sheet=null;

    render();

    return;
  }

  sheet=null;

  render();
}

/* -------------------------------------------------
   START
------------------------------------------------- */

loadState();
ensureAllMonths();
render();
</script>

</html>
