let S;
let sheet=null;
let fabOpen=false;
let saveTimer=null;
/* =============================
   HELPERS
============================= */
function clone(x){
  return JSON.parse(JSON.stringify(x));
}
function uid(){
  return "id_"+Math.random().toString(36).slice(2)+Date.now().toString(36);
}
function n(v){
  const x=parseFloat(v);
  return Number.isFinite(x)?x:0;
}
function money(v){
  return n(v).toLocaleString("en-US",{
    style:"currency",
    currency:"USD",
    minimumFractionDigits:2
  });
}
function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
function monthKey(date){
  return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0");
}
function shiftMonth(ym,delta){
  const [y,m]=ym.split("-").map(Number);
  return monthKey(new Date(y,m-1+delta,1));
}
function monthLabel(ym){
  const [y,m]=ym.split("-").map(Number);
  return new Date(y,m-1,1).toLocaleDateString("en-US",{
    month:"long",
    year:"numeric"
  });
}
function shortMonth(ym){
  const [y,m]=ym.split("-").map(Number);
  return new Date(y,m-1,1).toLocaleDateString("en-US",{
    month:"short",
    year:"numeric"
  });
}
function showToast(text){
  const el=document.getElementById("toast");
  el.textContent=text;
  Object.assign(el.style,{
    display:"block",
    position:"fixed",
    left:"50%",
    bottom:"calc(94px + env(safe-area-inset-bottom))",
    transform:"translateX(-50%)",
    background:"rgba(50,50,52,.97)",
    color:"#fff",
    padding:"9px 16px",
    borderRadius:"99px",
    fontSize:"14px",
    fontWeight:"600",
    zIndex:"2000"
  });
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>{
    el.style.display="none";
  },1400);
}
/* =============================
   MONTH SYSTEM
============================= */
/*
  S.months is now the ONLY source of truth.
  This fixes the old problem where the app
  only displayed September and January.
  Example:
  [
    "2026-09",
    "2026-10",
    "2026-11",
    "2026-12",
    "2027-01"
  ]
*/
function allMonths(){
  if(!Array.isArray(S.months)){
    S.months=[...DEFAULT_MONTHS];
  }
  return [...new Set(S.months)].sort();
}
function addMonthKey(ym){
  if(!S.months.includes(ym)){
    S.months.push(ym);
  }
  S.months.sort();
  ensureMonth(ym);
}
function removeMonthKey(ym){
  /*
    September is the starting month and cannot
    be deleted because there would be no
    beginning to the carry-over chain.
  */
  if(ym===APP_START){
    showToast("September cannot be removed");
    return false;
  }
  if(S.months.length<=1){
    showToast("Keep at least one month");
    return false;
  }
  S.months=
    S.months.filter(m=>m!==ym);
  /*
    If the deleted month was active,
    move to the closest remaining month.
  */
  if(S.activeMonth===ym){
    const months=allMonths();
    const previous=
      months.filter(m=>m<ym).pop();
    const next=
      months.find(m=>m>ym);
    S.activeMonth=
      previous ||
      next ||
      APP_START;
  }
  /*
    If the deleted month was the goal month,
    move the goal to the last remaining month.
  */
  if(S.goalMonth===ym){
    const months=allMonths();
    S.goalMonth=
      months[months.length-1];
  }
  return true;
}
function normalizeBudget(budget){
  const defaults=clone({
    ...DEFAULT_CATEGORIES,
    ...DEFAULT_INVESTING
  });
  const result={};
  Object.keys(defaults).forEach(key=>{
    const source=
      budget?.[key] ||
      defaults[key];
    result[key]={
      label:source.label,
      color:source.color,
      icon:source.icon,
      items:Array.isArray(source.items)
        ?source.items.map(item=>({
            id:item.id||uid(),
            label:item.label||"Item",
            amount:n(item.amount)
          }))
        :[]
    };
  });
  Object.keys(budget||{}).forEach(key=>{
    if(!result[key]){
      const source=budget[key];
      result[key]={
        label:source.label||key,
        color:source.color||"#0a84ff",
        icon:source.icon||"📁",
        items:Array.isArray(source.items)
          ?source.items.map(item=>({
              id:item.id||uid(),
              label:item.label||"Item",
              amount:n(item.amount)
            }))
          :[]
      };
    }
  });
  return result;
}
function ensureMonth(ym){
  if(!S.monthBudgets){
    S.monthBudgets={};
  }
  if(S.monthBudgets[ym]){
    return;
  }
  const months=allMonths();
  const index=months.indexOf(ym);
  /*
    Find the immediately preceding EXISTING
    month in the actual month list.
  */
  const previous=
    index>0
      ?months[index-1]
      :null;
  if(
    previous &&
    S.monthBudgets[previous]
  ){
    S.monthBudgets[ym]=
      clone(S.monthBudgets[previous]);
  }else{
    S.monthBudgets[ym]=
      normalizeBudget(
        S.categories
      );
  }
}
function ensureAllMonths(){
  const months=allMonths();
  months.forEach(ym=>{
    ensureMonth(ym);
  });
}
function categoryBudget(ym){
  ensureMonth(ym);
  return S.monthBudgets[ym];
}
function categoryTotal(ym,category){
  return (category?.items||[])
    .reduce(
      (sum,item)=>sum+n(item.amount),
      0
    );
}
function recurringSpending(ym){
  const budget=categoryBudget(ym);
  return Object.entries(budget)
    .filter(([key])=>key!=="investing")
    .reduce(
      (sum,[,category])=>
        sum+categoryTotal(ym,category),
      0
    );
}
function investmentSpending(ym){
  return categoryTotal(
    ym,
    categoryBudget(ym).investing
  );
}
function getMiscBudget(ym){
  const ov=
    S.monthOverrides?.[ym];
  if(
    ov &&
    Object.prototype.hasOwnProperty.call(
      ov,
      "miscBudget"
    )
  ){
    return n(ov.miscBudget);
  }
  return n(S.miscBudget);
}
function oneTimeTotal(ym){
  return (S.oneTimeExpenses||[])
    .filter(e=>e.month===ym)
    .reduce(
      (sum,e)=>sum+n(e.amount),
      0
    );
}
function baseIncome(ym){
  const ov=
    S.monthOverrides?.[ym];
  if(
    ov &&
    Object.prototype.hasOwnProperty.call(
      ov,
      "income"
    )
  ){
    return n(ov.income);
  }
  return n(S.income);
}
function extraIncome(ym){
  return (
    S.monthOverrides?.[ym]?.extraIncome||[]
  )
  .reduce(
    (sum,e)=>sum+n(e.amount),
    0
  );
}
function totalIncome(ym){
  return baseIncome(ym)+extraIncome(ym);
}
function totalSpending(ym){
  return recurringSpending(ym)+
    getMiscBudget(ym)+
    investmentSpending(ym)+
    oneTimeTotal(ym);
}
function monthlyNet(ym){
  return totalIncome(ym)-totalSpending(ym);
}
/*
  IMPORTANT:
  Starting balance is calculated from the
  previous MONTH THAT ACTUALLY EXISTS.
  If you have:
  Sep
  Oct
  Nov
  Dec
  Jan
  Jan starts from December's ending balance.
  If you delete November:
  Sep
  Oct
  Dec
  Jan
  December starts from October's ending balance.
  Nothing is permanently linked between budgets.
*/
function startingBalance(ym){
  const months=allMonths();
  const index=months.indexOf(ym);
  if(index<=0){
    return 0;
  }
  const previous=
    months[index-1];
  return endingBalance(previous);
}
function endingBalance(ym){
  return startingBalance(ym)+
    monthlyNet(ym);
}
function goalTotal(){
  return (S.goalExpenses||[])
    .reduce(
      (sum,e)=>sum+n(e.amount),
      0
    );
}
function projectedGoalBalance(){
  let balance=0;
  allMonths().forEach(ym=>{
    if(ym<=S.goalMonth){
      balance=endingBalance(ym);
    }
  });
  return Math.max(0,balance);
}
function goalPercent(){
  const target=goalTotal();
  if(!target)return 0;
  return Math.min(
    100,
    Math.max(
      0,
      Math.round(
        projectedGoalBalance()/target*100
      )
    )
  );
}
/* =============================
   MIGRATION
============================= */
function migrateState(state){
  /*
    Upgrade old data to the explicit
    months architecture.
    If the old version only had September
    and January, we intentionally create:
    September
    October
    November
    December
    January
  */
  if(!Array.isArray(state.months)){
    state.months=
      [...DEFAULT_MONTHS];
  }else{
    /*
      Always make sure the initial five
      months exist after the upgrade.
    */
    DEFAULT_MONTHS.forEach(ym=>{
      if(!state.months.includes(ym)){
        state.months.push(ym);
      }
    });
    state.months.sort();
  }
  if(!state.monthBudgets){
    state.monthBudgets={};
  }
  ensureStateCategories(state);
  /*
    Preserve September from the previous app.
  */
  state.monthBudgets[APP_START]=
    normalizeBudget(
      state.monthBudgets[APP_START] ||
      state.categories
    );
  /*
    Build October through January from
    the immediately previous month.
    Existing month budgets are preserved.
  */
  const months=
    [...state.months].sort();
  months.forEach((ym,index)=>{
    if(
      !state.monthBudgets[ym]
    ){
      const previous=
        index>0
          ?months[index-1]
          :null;
      if(
        previous &&
        state.monthBudgets[previous]
      ){
        state.monthBudgets[ym]=
          clone(
            state.monthBudgets[previous]
          );
      }else{
        state.monthBudgets[ym]=
          normalizeBudget(
            state.categories
          );
      }
    }
  });
  state.monthOverrides=
    state.monthOverrides||{};
  state.monthOverrides["2026-09"]=
    state.monthOverrides["2026-09"]||{};
  const sep=
    state.monthOverrides["2026-09"];
  sep.extraIncome=
    Array.isArray(sep.extraIncome)
      ?sep.extraIncome
      :[];
  let deal=
    sep.extraIncome.find(
      e=>
        e.label==="Deal / Contract Payment"
    );
  if(deal){
    deal.amount=4500;
  }else{
    sep.extraIncome.push({
      id:"ei_deal_2026_09",
      label:"Deal / Contract Payment",
      amount:4500
    });
  }
  state.oneTimeExpenses=
    Array.isArray(state.oneTimeExpenses)
      ?state.oneTimeExpenses
      :[];
  function upsertOneTime(
    label,
    amount,
    month
  ){
    const existing=
      state.oneTimeExpenses.find(
        e=>
          e.label===label &&
          e.month===month
      );
    if(existing){
      existing.amount=amount;
    }else{
      state.oneTimeExpenses.push({
        id:
          "ot_"+
          label
            .toLowerCase()
            .replace(/[^a-z0-9]+/g,"_"),
        label,
        amount,
        month
      });
    }
  }
  upsertOneTime(
    "Car Repairs",
    1780,
    "2026-09"
  );
  upsertOneTime(
    "September Rent (deferred, paid early)",
    525,
    "2026-09"
  );
  state.oneTimeExpenses=
    state.oneTimeExpenses.filter(
      e=>
        !(
          e.label==="September Rent (deferred)" &&
          e.month==="2026-09"
        )
    );
  upsertOneTime(
    "Overdraft Payoff",
    728.67,
    "2026-09"
  );
  upsertOneTime(
    "Debt Payment",
    1000,
    "2026-09"
  );
  upsertOneTime(
    "Xbox Series S (promised to son)",
    538.74,
    "2026-09"
  );
  const phone=
    state.monthBudgets["2026-09"]?.phone;
  if(phone){
    const items=
      Array.isArray(phone.items)
        ?phone.items
        :(phone.items=[]);
    const appleOne=
      items.find(
        i=>
          i.id==="apple_one" ||
          i.label==="Apple One"
      );
    if(appleOne){
      appleOne.amount=39.99;
    }
    let appleCare=
      items.find(
        i=>
          i.id==="applecare_daughter" ||
          (
            i.label &&
            i.label.includes("AppleCare+")
          )
      );
    if(appleCare){
      appleCare.id=
        "applecare_daughter";
      appleCare.label=
        "AppleCare+ (Daughter's Phone)";
      appleCare.amount=19.99;
    }else{
      items.push({
        id:"applecare_daughter",
        label:"AppleCare+ (Daughter's Phone)",
        amount:19.99
      });
    }
  }
  if(
    sep.miscBudget===2362.08
  ){
    delete sep.miscBudget;
  }
  /*
    Make sure goal month exists.
  */
  if(
    !state.months.includes(
      state.goalMonth
    )
  ){
    state.months.push(
      state.goalMonth
    );
    state.months.sort();
  }
  return state;
}
function ensureStateCategories(state){
  const defaults={
    ...clone(DEFAULT_CATEGORIES),
    ...clone(DEFAULT_INVESTING)
  };
  state.categories=
    state.categories||
    clone(defaults);
  Object.keys(defaults).forEach(key=>{
    if(!state.categories[key]){
      state.categories[key]=
        clone(defaults[key]);
    }
  });
}
function loadState(){
  try{
    const raw=
      localStorage.getItem(SAVE_KEY);
    if(raw){
      const parsed=
        JSON.parse(raw);
      const defaults=
        clone(DEFAULT_STATE);
      S={
        ...defaults,
        ...parsed,
        months:
          Array.isArray(parsed.months)
            ?parsed.months
            :undefined,
        categories:
          parsed.categories||
          defaults.categories,
        monthBudgets:
          parsed.monthBudgets||
          {},
        goalExpenses:
          parsed.goalExpenses||
          defaults.goalExpenses,
        oneTimeExpenses:
          parsed.oneTimeExpenses||
          [],
        monthOverrides:
          parsed.monthOverrides||
          {},
        checklist:
          parsed.checklist||
          defaults.checklist
      };
      migrateState(S);
      ensureAllMonths();
      localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(S)
      );
      return;
    }
  }catch(err){
    console.error(
      "God's Plan load error:",
      err
    );
  }
  S=
    clone(DEFAULT_STATE);
  migrateState(S);
  ensureAllMonths();
  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(S)
  );
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{

      );
      showToast("✓ Saved");

}

/* =============================
   EVENTS
============================= */
function bindEvents(){
  document.querySelectorAll("[data-tab]")
    .forEach(btn=>{
      btn.onclick=()=>{
        S.tab=btn.dataset.tab;
        fabOpen=false;
        sheet=null;
        save();
        render();
      };
    });
  document.querySelectorAll(
    ".nav [data-month]"
  ).forEach(btn=>{
    btn.onclick=()=>{
      S.activeMonth=
        btn.dataset.month;
      fabOpen=false;
      sheet=null;
      ensureMonth(
        S.activeMonth
      );
      save();
      render();
    };
  });
  document.querySelectorAll(
    "[data-category]"
  ).forEach(btn=>{
    btn.onclick=()=>{
      sheet={
        type:"category",
        month:S.activeMonth,
        key:btn.dataset.category,
        color:
          categoryBudget(
            S.activeMonth
          )[btn.dataset.category].color
      };
      render();
    };
  });
  document.querySelectorAll(
    "[data-edit-category]"
  ).forEach(btn=>{
    btn.onclick=()=>{
      sheet={
        type:"category",
        month:S.activeMonth,
        key:btn.dataset.editCategory,
        color:
          categoryBudget(
            S.activeMonth
          )[btn.dataset.editCategory].color
      };
      render();
    };
  });
  document.querySelectorAll(
    "[data-amount]"
  ).forEach(input=>{
    input.onchange=()=>{
      const ym=S.activeMonth;
      const key=input.dataset.amount;
      const id=input.dataset.item;
      const item=
        categoryBudget(ym)
          [key]
          ?.items
          ?.find(
            x=>x.id===id
          );
      if(item){
        item.amount=
          n(input.value);
        save();
        render();
      }
    };
  });
  const misc=
    document.querySelector(
      "[data-misc]"
    );
  if(misc){
    misc.onchange=()=>{
      const ov=
        S.monthOverrides[
          S.activeMonth
        ]||
        (
          S.monthOverrides[
            S.activeMonth
          ]={}
        );
      ov.miscBudget=
        n(misc.value);
      save();
      render();
    };
  }
  document.querySelectorAll(
    "[data-edit-one]"
  ).forEach(btn=>{
    btn.onclick=()=>{
      const e=
        S.oneTimeExpenses.find(
          x=>x.id===btn.dataset.editOne
        );
      if(!e)return;
      sheet={
        type:"one",
        id:e.id,
        month:e.month
      };
      render();
    };
  });
  const addOne=
    document.querySelector(
      "[data-add-one]"
    );
  if(addOne){
    addOne.onclick=()=>{
      sheet={
        type:"one",
        month:S.activeMonth
      };
      render();
    };
  }
  document.querySelectorAll(
    "[data-goal-item]"
  ).forEach(btn=>{
    btn.onclick=()=>{
      sheet={
        type:"goalItem",
        id:btn.dataset.goalItem
      };
      render();
    };
  });
  const addGoal=
    document.querySelector(
      "[data-add-goal]"
    );
  if(addGoal){
    addGoal.onclick=()=>{
      sheet={
        type:"goalItem"
      };
      render();
    };
  }
  document.querySelectorAll(
    "[data-goal-setting]"
  ).forEach(btn=>{
    btn.onclick=()=>{
      const type=
        btn.dataset.goalSetting;
      if(type==="name"){
        sheet={
          type:"goalName"
        };
      }
      if(type==="month"){
        sheet={
          type:"goalMonth"
        };
      }
      if(type==="amount"){
        sheet={
          type:"goalAmount"
        };
      }
      render();
    };
  });
  document.querySelectorAll(
    "[data-income]"
  ).forEach(btn=>{
    btn.onclick=()=>{
      sheet={
        type:"income",
        month:S.activeMonth
      };
      render();
    };
  });
  const openMonths=
    document.querySelector(
      "[data-open-months]"
    );
  if(openMonths){
    openMonths.onclick=()=>{
      sheet={
        type:"months"
      };
      render();
    };
  }
  const openChecklist=
    document.querySelector(
      "[data-open-checklist]"
    );
  if(openChecklist){
    openChecklist.onclick=()=>{
      sheet={
        type:"checklist"
      };
      render();
    };
  }
  const openSettings=
    document.querySelector(
      "[data-open-settings]"
    );
  if(openSettings){
    openSettings.onclick=()=>{
      sheet={
        type:"settings"
      };
      render();
    };
  }
  document.querySelectorAll(
    "[data-month-summary]"
  ).forEach(btn=>{
    btn.onclick=()=>{
      S.activeMonth=
        btn.dataset.monthSummary;
      save();
      render();
    };
  });
  const fabToggle=
    document.querySelector(
      "[data-fab-toggle]"
    );
  if(fabToggle){
    fabToggle.onclick=()=>{
      fabOpen=!fabOpen;
      render();
    };
  }
  const closeFab=
    document.querySelector(
      "[data-close-fab]"
    );
  if(closeFab){
    closeFab.onclick=()=>{
      fabOpen=false;
      render();
    };
  }
  document.querySelectorAll(
    "[data-fab]"
  ).forEach(btn=>{
    btn.onclick=()=>{
      const type=
        btn.dataset.fab;
      fabOpen=false;
      if(type==="extra"){
        sheet={
          type:"extra",
          month:S.activeMonth
        };
      }
      if(type==="expense"){
        sheet={
          type:"one",
          month:S.activeMonth
        };
      }
      if(type==="investment"){
        S.tab="investing";
        save();
        render();
        return;
      }
      if(type==="goal"){
        sheet={
          type:"goalItem"
        };
      }
      if(type==="check"){
        sheet={
          type:"checklist"
        };
      }
      render();
    };
  });
  bindSheetEvents();
}
/* =============================
   SHEET EVENTS
============================= */
function bindSheetEvents(){
  const cancel=
    document.querySelector(
      "[data-sheet-cancel]"
    );
  if(cancel){
    cancel.onclick=()=>{
      sheet=null;
      render();
    };
  }
  const bg=
    document.getElementById(
      "sheet-bg"
    );
  if(bg){
    bg.onclick=e=>{
      if(e.target===bg){
        sheet=null;
        render();
      }
    };
  }
  const saveBtn=
    document.querySelector(
      "[data-sheet-save]"
    );
  if(saveBtn){
    saveBtn.onclick=
      saveSheet;
  }
  /*
    Income
  */
  if(sheet?.type==="income"){
    const addExtra=
      document.querySelector(
        "[data-add-extra]"
      );
    if(addExtra){
      addExtra.onclick=()=>{
        sheet={
          type:"extra",
          month:sheet.month
        };
        render();
      };
    }
    document.querySelectorAll(
      "[data-edit-extra]"
    ).forEach(btn=>{
      btn.onclick=()=>{
        sheet={
          type:"extra",
          id:btn.dataset.editExtra,
          month:sheet.month
        };
        render();
      };
    });
  }
  /*
    Extra income
  */
  if(sheet?.type==="extra"){
    const del=
      document.querySelector(
        "[data-delete-extra]"
      );
    if(del){
      del.onclick=()=>{
        const list=
          S.monthOverrides?.[
            sheet.month
          ]?.extraIncome||[];
        S.monthOverrides[
          sheet.month
        ].extraIncome=
          list.filter(
            e=>e.id!==sheet.id
          );
        save();
        sheet={
          type:"income",
          month:sheet.month
        };
        render();
      };
    }
  }
  /*
    Category editor
  */
  if(sheet?.type==="category"){
    document.querySelectorAll(
      "[data-color]"
    ).forEach(btn=>{
      btn.onclick=()=>{
        sheet.color=
          btn.dataset.color;
        document.querySelectorAll(
          "[data-color]"
        ).forEach(x=>{
          x.classList.toggle(
            "selected",
            x.dataset.color===
              sheet.color
          );
        });
      };
    });
    document.querySelectorAll(
      "[data-delete-item]"
    ).forEach(btn=>{
      btn.onclick=()=>{
        const c=
          categoryBudget(
            sheet.month
          )[sheet.key];
        c.items=
          c.items.filter(
            i=>
              i.id!==btn.dataset.deleteItem
          );
        save();
        render();
      };
    });
    const add=
      document.querySelector(
        "[data-add-item]"
      );
    if(add){
      add.onclick=()=>{
        const input=
          document.getElementById(
            "new-item"
          );
        const value=
          input?.value?.trim();
        if(!value)return;
        categoryBudget(
          sheet.month
        )[sheet.key]
          .items
          .push({
            id:uid(),
            label:value,
            amount:0
          });
        save();
        render();
      };
    }
  }
  /*
    One-time expense
  */
  if(sheet?.type==="one"){
    document.querySelectorAll(
      "[data-one-month]"
    ).forEach(btn=>{
      btn.onclick=()=>{
        sheet.month=
          btn.dataset.oneMonth;
        document.querySelectorAll(
          "[data-one-month]"
        ).forEach(x=>{
          x.classList.toggle(
            "active",
            x.dataset.oneMonth===
              sheet.month
          );
        });
      };
    });
    const del=
      document.querySelector(
        "[data-delete-one]"
      );
    if(del){
      del.onclick=()=>{
        S.oneTimeExpenses=
          S.oneTimeExpenses.filter(
            e=>e.id!==sheet.id
          );
        save();
        sheet=null;
        render();
      };
    }
  }
  /*
    Goal item
  */
  if(sheet?.type==="goalItem"){
    const del=
      document.querySelector(
        "[data-delete-goal]"
      );
    if(del){
      del.onclick=()=>{
        S.goalExpenses=
          S.goalExpenses.filter(
            e=>e.id!==sheet.id
          );
        save();
        sheet=null;
        render();
      };
    }
  }
  /*
    Goal month
  */
  if(sheet?.type==="goalMonth"){
    document.querySelectorAll(
      "[data-goal-month]"
    ).forEach(btn=>{
      btn.onclick=()=>{
        S.goalMonth=
          btn.dataset.goalMonth;
        save();
        sheet=null;
        render();
      };
    });
  }
  /*
    MONTH MANAGER
  */
  if(sheet?.type==="months"){
    /*
      Select month
    */
    document.querySelectorAll(
      "[data-select-month]"
    ).forEach(btn=>{
      btn.onclick=e=>{
        /*
          Don't select the month when
          the delete button itself was tapped.
        */
        if(
          e.target.closest(
            "[data-delete-month]"
          )
        ){
          return;
        }
        S.activeMonth=
          btn.dataset.selectMonth;
        ensureMonth(
          S.activeMonth
        );
        save();
        sheet=null;
        render();
      };
    });
    /*
      Delete month
    */
    document.querySelectorAll(
      "[data-delete-month]"
    ).forEach(btn=>{
      btn.onclick=e=>{
        e.stopPropagation();
        const ym=
          btn.dataset.deleteMonth;
        const ok=
          confirm(
            `Remove ${monthLabel(ym)} from your plan?`
          );
        if(!ok)return;
        if(
          removeMonthKey(ym)
        ){
          save();
          showToast(
            `${shortMonth(ym)} removed`
          );
          render();
        }
      };
    });
    /*
      Add next month
    */
    const add=
      document.querySelector(
        "[data-add-month]"
      );
    if(add){
      add.onclick=()=>{
        const months=
          allMonths();
        const last=
          months[months.length-1];
        const next=
          shiftMonth(last,1);
        /*
          Create it immediately.
        */
        const previousBudget=
          S.monthBudgets[last]
            ?clone(
              S.monthBudgets[last]
            )
            :normalizeBudget(
              S.categories
            );
        addMonthKey(next);
        /*
          Copy previous budget ONLY
          during creation.
        */
        S.monthBudgets[next]=
          clone(previousBudget);
        /*
          Copy previous month's income
          as the initial value.
        */
        S.monthOverrides[next]=
          S.monthOverrides[next]||{};
        S.monthOverrides[next].income=
          baseIncome(last);
        S.activeMonth=next;
        save();
        sheet=null;
        render();
      };
    }
    /*
      Add custom month
    */
    const custom=
      document.querySelector(
        "[data-add-custom-month]"
      );
    if(custom){
      custom.onclick=()=>{
        sheet={
          type:"addCustomMonth"
        };
        render();
      };
    }
  }
  /*
    Checklist
  */
  if(sheet?.type==="checklist"){
    document.querySelectorAll(
      "[data-toggle-check]"
    ).forEach(row=>{
      row.onclick=e=>{
        if(
          e.target.closest(
            "[data-delete-check]"
          )
        ){
          return;
        }
        const item=
          S.checklist.find(
            x=>
              x.id===
              row.dataset.toggleCheck
          );
        if(item){
          item.done=!item.done;
          save();
          render();
        }
      };
    });
    document.querySelectorAll(
      "[data-delete-check]"
    ).forEach(btn=>{
      btn.onclick=e=>{
        e.stopPropagation();
        S.checklist=
          S.checklist.filter(
            x=>
              x.id!==
              btn.dataset.deleteCheck
          );
        save();
        render();
      };
    });
    const add=
      document.querySelector(
        "[data-add-check]"
      );
    if(add){
      add.onclick=()=>{
        const input=
          document.getElementById(
            "new-check"
          );
        const value=
          input?.value?.trim();
        if(!value)return;
        S.checklist.push({
          id:uid(),
          label:value,
          done:false
        });
        save();
        render();
      };
    }
  }
}
/* =============================
   SAVE SHEET
============================= */
function saveSheet(){
  if(!sheet)return;
  /*
    Income
  */
  if(sheet.type==="income"){
    const value=
      document.getElementById(
        "income-input"
      )?.value;
    S.monthOverrides[
      sheet.month
    ]=
      S.monthOverrides[
        sheet.month
      ]||{};
    S.monthOverrides[
      sheet.month
    ].income=
      n(value);
    save();
    sheet=null;
    render();
    return;
  }
  /*
    Extra income
  */
  if(sheet.type==="extra"){
    const label=
      document.getElementById(
        "extra-label"
      )?.value?.trim();
    const amount=
      n(
        document.getElementById(
          "extra-amount"
        )?.value
      );
    if(!label)return;
    S.monthOverrides[
      sheet.month
    ]=
      S.monthOverrides[
        sheet.month
      ]||{};
    S.monthOverrides[
      sheet.month
    ].extraIncome=
      S.monthOverrides[
        sheet.month
      ].extraIncome||[];
    const list=
      S.monthOverrides[
        sheet.month
      ].extraIncome;
    if(sheet.id){
      const e=
        list.find(
          x=>x.id===sheet.id
        );
      if(e){
        e.label=label;
        e.amount=amount;
      }
    }else{
      list.push({
        id:uid(),
        label,
        amount
      });
    }
    save();
    sheet={
      type:"income",
      month:sheet.month
    };
    render();
    return;
  }
  /*
    Category
  */
  if(sheet.type==="category"){
    const c=
      categoryBudget(
        sheet.month
      )[sheet.key];
    const name=
      document.getElementById(
        "cat-name"
      )?.value?.trim();
    const icon=
      document.getElementById(
        "cat-icon"
      )?.value?.trim();
    if(name)c.label=name;
    if(icon)c.icon=icon;
    if(sheet.color){
      c.color=sheet.color;
    }
    document.querySelectorAll(
      "[data-item-label]"
    ).forEach(input=>{
      const item=
        c.items.find(
          x=>
            x.id===
            input.dataset.itemLabel
        );
      if(item){
        const value=
          input.value.trim();
        if(value){
          item.label=value;
        }
      }
    });
    save();
    sheet=null;
    render();
    return;
  }
  /*
    One-time
  */
  if(sheet.type==="one"){
    const label=
      document.getElementById(
        "one-label"
      )?.value?.trim();
    const amount=
      n(
        document.getElementById(
          "one-amount"
        )?.value
      );
    if(!label)return;
    if(sheet.id){
      const e=
        S.oneTimeExpenses.find(
          x=>x.id===sheet.id
        );
      if(e){
        e.label=label;
        e.amount=amount;
        e.month=
          sheet.month||e.month;
      }
    }else{
      S.oneTimeExpenses.push({
        id:uid(),
        label,
        amount,
        month:
          sheet.month||
          S.activeMonth
      });
    }
    save();
    sheet=null;
    render();
    return;
  }
  /*
    Goal item
  */
  if(sheet.type==="goalItem"){
    const label=
      document.getElementById(
        "goal-item-label"
      )?.value?.trim();
    const amount=
      n(
        document.getElementById(
          "goal-item-amount"
        )?.value
      );
    const note=
      document.getElementById(
        "goal-item-note"
      )?.value?.trim()||"";
    if(!label)return;
    if(sheet.id){
      const e=
        S.goalExpenses.find(
          x=>x.id===sheet.id
        );
      if(e){
        e.label=label;
        e.amount=amount;
        e.estimate=note;
      }
    }else{
      S.goalExpenses.push({
        id:uid(),
        label,
        amount,
        estimate:note
      });
    }
    save();
    sheet=null;
    render();
    return;
  }
  /*
    Goal name
  */
  if(sheet.type==="goalName"){
    const value=
      document.getElementById(
        "goal-name"
      )?.value?.trim();
    if(value){
      S.goalLabel=value;
    }
    save();
    sheet=null;
    render();
    return;
  }
  /*
    Goal amount
  */
  if(sheet.type==="goalAmount"){
    const target=
      n(
        document.getElementById(
          "goal-amount"
        )?.value
      );
    const current=
      goalTotal();
    const difference=
      target-current;
    if(S.goalExpenses.length){
      const last=
        S.goalExpenses[
          S.goalExpenses.length-1
        ];
      last.amount=
        Math.max(
          0,
          n(last.amount)+difference
        );
    }else{
      S.goalExpenses.push({
        id:uid(),
        label:"Move Day Goal",
        amount:target,
        estimate:""
      });
    }
    save();
    sheet=null;
    render();
    return;
  }
  /*
    Custom month
  */
  if(sheet.type==="addCustomMonth"){
    const input=
      document.getElementById(
        "custom-month"
      );
    const ym=
      input?.value;
    if(!ym){
      showToast("Choose a month");
      return;
    }
    if(S.months.includes(ym)){
      showToast("Month already exists");
      return;
    }
    /*
      Find closest previous existing month.
    */
    const previous=
      allMonths()
        .filter(m=>m<ym)
        .pop();
    /*
      If there is a previous month,
      copy its budget once.
    */
    if(previous){
      ensureMonth(previous);
      S.monthBudgets[ym]=
        clone(
          S.monthBudgets[previous]
        );
      S.monthOverrides[ym]=
        S.monthOverrides[ym]||{};
      S.monthOverrides[ym].income=
        baseIncome(previous);
    }else{
      S.monthBudgets[ym]=
        normalizeBudget(
          S.categories
        );
    }
    addMonthKey(ym);
    S.activeMonth=ym;
    save();
    sheet=null;
    render();
    return;
  }
  /*
    Months sheet
  */
  if(sheet.type==="months"){
    sheet=null;
    render();
    return;
  }
  /*
    Checklist
  */
  if(sheet.type==="checklist"){
    sheet=null;
    render();
    return;
  }
  /*
    Settings
  */
  if(sheet.type==="settings"){
    const income=
      n(
        document.getElementById(
          "settings-income"
        )?.value
      );
    const misc=
      n(
        document.getElementById(
          "settings-misc"
        )?.value
      );
    S.income=income;
    S.miscBudget=misc;
    save();
    sheet=null;
    render();
    return;
  }
  sheet=null;
  render();
}
/* =============================
   START
============================= */
loadState();
ensureAllMonths();
render();
</script>
</body>
</html>
